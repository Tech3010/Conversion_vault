<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Conversion Vault · Smart Format Suggestor</title>
  <style>
    :root {
      --bg:#090d16; --surface:#0f1624; --card:#131c2e; --card-elev:#172236; --input:#0a0f1a;
      --border:#1e293b; --border-strong:#334155; --text:#f8fafc; --muted:#94a3b8;
      --crimson:#db0a40; --crimson-soft:rgba(219,10,64,0.14); --crimson-hover:#be0837;
      --gold:#fcd116; --gold-soft:rgba(252,209,22,0.13); --gold-text:#fcd116;
      --emerald:#10b981; --emerald-soft:rgba(16,185,129,0.14);
      --radius:12px; --radius-sm:8px;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      --mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.45;min-height:100vh;display:flex;justify-content:center;}
    .app-frame{width:100%;max-width:540px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);padding-bottom:32px;}
    @media(min-width:600px){.app-frame{border-left:1px solid var(--border);border-right:1px solid var(--border);}}
    .app-bar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .bar-left{display:flex;align-items:center;gap:10px;}
    .back-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
    .back-btn:hover{border-color:var(--crimson);color:var(--crimson);}
    .page-title{font-size:15px;font-weight:700;line-height:1.2;}
    .page-sub{font-size:11px;color:var(--muted);font-family:var(--mono);}
    .suggest-badge{
      font-family:var(--mono);font-size:10px;font-weight:800;padding:4px 9px;border-radius:6px;
      background:linear-gradient(135deg,var(--gold-soft),var(--crimson-soft));
      color:var(--gold-text);border:1px solid rgba(252,209,22,0.5);letter-spacing:0.05em;
    }
    .content{padding:14px 16px;display:flex;flex-direction:column;gap:14px;flex:1;}

    .card-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;display:flex;flex-direction:column;gap:10px;}
    .sec-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:5px;border-bottom:1px solid var(--border);}
    .sec-lbl{font-family:var(--mono);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold-text);}
    .sec-note{font-family:var(--mono);font-size:9.5px;color:var(--muted);}

    .chip-wrap{display:flex;flex-wrap:wrap;gap:6px;}
    .s-chip{
      padding:6px 10px;border-radius:7px;border:1px solid var(--border-strong);
      background:var(--card);color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;
      transition:border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
    }
    .s-chip:hover{border-color:var(--gold);color:var(--text);}
    .s-chip.active{border-color:var(--crimson);background:var(--crimson-soft);color:var(--text);}
    .s-chip.is-none.active{border-color:var(--border-strong);background:var(--card-elev);color:var(--muted);}

    .rec-head-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:-4px;flex-wrap:wrap;}
    .rec-list{display:flex;flex-direction:column;gap:10px;}
    .rec-card{
      background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);
      padding:13px 14px;display:flex;flex-direction:column;gap:8px;
    }
    .rec-card.rank-1{border-color:rgba(16,185,129,0.65);box-shadow:inset 3px 0 0 var(--emerald);background:linear-gradient(135deg,var(--emerald-soft) 0%,var(--surface) 70%);}
    .rec-card.rank-2{box-shadow:inset 3px 0 0 var(--gold);}
    .rec-card.rank-3{box-shadow:inset 3px 0 0 var(--crimson);}
    .rec-card.rank-4{box-shadow:inset 3px 0 0 #38bdf8;}

    .rec-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
    .rank-pill{font-family:var(--mono);font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:4px;}
    .rp-1{background:var(--emerald-soft);color:var(--emerald);}
    .rp-2{background:var(--gold-soft);color:var(--gold-text);}
    .rp-3{background:var(--crimson-soft);color:var(--crimson);}
    .rp-4{background:rgba(56,189,248,0.14);color:#38bdf8;}

    .rec-name{font-size:14px;font-weight:800;color:var(--text);}
    .rec-why{font-size:12px;color:var(--muted);line-height:1.45;}
    .spec-pill{background:#05070b;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-family:var(--mono);font-size:10.5px;color:var(--gold-text);line-height:1.45;}

    .rec-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px;}
    .btn-use{
      flex:1;padding:7px 12px;border-radius:7px;border:1px solid var(--crimson);
      background:var(--crimson);color:#ffffff;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    }
    .btn-use:hover{background:var(--crimson-hover);}
    .btn-sec{
      padding:7px 10px;border-radius:7px;border:1px solid var(--border-strong);
      background:var(--card-elev);color:var(--text);font-family:var(--mono);
      font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    }
    .btn-sec:hover{border-color:var(--gold);color:var(--gold-text);}

    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity 0.2s ease;z-index:120;}
    .toast.show{opacity:1;}
  </style>
  <script>
    (function(){
      try {
        var t = (window.AndroidBridge && window.AndroidBridge.getAppState && window.AndroidBridge.getAppState('cv_theme')) || localStorage.getItem('cv_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="app-frame">
    <header class="app-bar">

        <button type="button" id="btn-back" class="back-btn" aria-label="Back to Home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

    <main class="content">
      <!-- 1. TARGET DEVICE -->
      <section class="card-box" aria-label="Target Device">
        <div class="sec-head">
          <span class="sec-lbl">1. Target Device</span>
          <span class="sec-note">Pick any 1 across all groups</span>

        <div class="chip-wrap" id="grp-device">

          <button type="button" class="s-chip" data-val="smart_tv">Smart Display / TV</button>
          <button type="button" class="s-chip" data-val="projector">Projector / USB Stick</button>
          <button type="button" class="s-chip" data-val="car">Car Stereo / Head Unit</button>
          <button type="button" class="s-chip" data-val="old_phone">Older / Low-End Phone</button>
          <button type="button" class="s-chip" data-val="web">Web Browser</button>
        </div>
      </section>

      <!-- 2. PURPOSE / GOAL -->
      <section class="card-box" aria-label="Purpose or Goal">
        <div class="sec-head">
          <span class="sec-lbl">2. Purpose / Goal</span>
          <span class="sec-note">Pick any 1 across all groups</span>
        </div>
        <div class="chip-wrap" id="grp-purpose">
          <button type="button" class="s-chip" data-val="reels">Social / Reels &amp; Shorts</button>
          <button type="button" class="s-chip" data-val="edit">Video Editing (Alight / CapCut)</button>
          <button type="button" class="s-chip" data-val="archive">Archive / Master Storage</button>
          <button type="button" class="s-chip" data-val="share">Chat / Fast Share</button>
          <button type="button" class="s-chip" data-val="stream">Home Media / Plex</button>
          <button type="button" class="s-chip" data-val="audio">Music / Audio Only</button>
          <button type="button" class="s-chip" data-val="photo">Photos / Web Gallery</button>
        </div>
      </section>

      <!-- 3. CUSTOM PRIORITY METRIC -->
      <section class="card-box" aria-label="Priority Metric">
        <div class="sec-head">
          <span class="sec-lbl">3. Custom Priority Metric</span>
          <span class="sec-note">Pick any 1 across all groups</span>
        </div>
        <div class="chip-wrap" id="grp-metric">
          <button type="button" class="s-chip" data-val="balanced">Balanced (Sweet Spot)</button>
          <button type="button" class="s-chip" data-val="quality">Max Quality Preserved</button>
          <button type="button" class="s-chip" data-val="size">Smallest File Size</button>
          <button type="button" class="s-chip" data-val="speed">Processing Speed / Battery</button>
          <button type="button" class="s-chip" data-val="compat">Max Compatibility</button>
          <button type="button" class="s-chip" data-val="raw">Raw / Zero-Lag Editing</button>
          <button type="button" class="s-chip" data-val="privacy">Privacy / Forensic Scrub</button>
        </div>
      </section>

      <!-- 4 RANKED RECOMMENDATIONS -->
      <div class="rec-head-row">
        <span class="sec-lbl">Recommended Presets (4 Options)</span>
        <span class="sec-note" id="combo-lbl"></span>
      </div>
      <section class="rec-list" id="rec-list" aria-label="Recommended Presets"></section>
    </main>
  </div>
  <div class="toast" id="toast">Ready</div>
  <script>
    let activeChoice = 'this_device';
    let deviceTel = null;

    function loadDeviceTelemetry() {
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.getDeviceTelemetry === 'function') {
          deviceTel = JSON.parse(window.AndroidBridge.getDeviceTelemetry());
          const chip = document.getElementById('chip-this-device');
          if (chip && deviceTel && deviceTel.model) {
            chip.textContent = 'This Device (' + deviceTel.model + ')';
          }
        }
      } catch (_) {}
    }

    function showToast(m) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = m;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    function buildThisDeviceRecs() {
      const model = (deviceTel && deviceTel.model) ? deviceTel.model : 'This Device';
      const c = (deviceTel && deviceTel.codecs) ? deviceTel.codecs : { h264HwDecode: true, hevc10bitHwDecode: true, av1HwDecode: false };
      const recs = [
        {
          name: 'H.264 60fps Daily Master',
          spec: '.mp4 · libx264 · yuv420p (8-bit) · CRF 18 · Max 12M · AAC 192k · +faststart',
          why: 'Hardware-decoded smoothly on ' + model + ' with zero H.264 10-bit decode bugs and crisp motion.'
        }
      ];
      if (c.hevc10bitHwDecode) {
        recs.push({
          name: 'HEVC 10-Bit Space Saver',
          spec: '.mkv · libx265 · yuv420p10le · CRF 19 · slow · Opus 192k',
          why: 'Verified HEVC 10-bit HW decode on ' + model + ' — cuts file size ~45% with zero color banding.'
        });
      } else {
        recs.push({
          name: 'HEVC 8-Bit Efficient MP4',
          spec: '.mp4 · libx265 · yuv420p · tag hvc1 · CRF 20 · AAC 192k · +faststart',
          why: 'Safe 8-bit HEVC tailored for ' + model + ' (avoids unsupported 10-bit HW decode).'
        });
      }
      if (c.av1HwDecode) {
        recs.push({
          name: 'AV1 Ultra-Compact (HW Ready)',
          spec: '.mp4 · libsvtav1 · yuv420p · CRF 26 · preset 6 · Opus 128k',
          why: 'Hardware AV1 decode detected on ' + model + ' — smallest storage footprint at crisp clarity.'
        });
      } else {
        recs.push({
          name: 'H.264 All-I Zero-Lag Edit',
          spec: '.mp4 · libx264 · Intra -g 1 · 0 B-Frames · CRF 15 · AAC 320k',
          why: 'Instant timeline scrubbing on ' + model + ' in CapCut and Alight Motion.'
        });
      }
      recs.push({
        name: 'Opus 192k + WebP 85% Companion',
        spec: '.opus (192k 48kHz) for Audio · .webp (Q85) for Images',
        why: 'Native Android support on ' + model + ' with best quality-per-MB for audio and photos.'
      });
      return recs;
    }

        { name: 'Opus 96k Voice / Audio Share', spec: '.opus · libopus · 96 kbps · EBU R128 (-14 LUFS)', why: 'Crystal-clear voice & music clips at tiny kilobyte sizes.' }
      ],
      stream: [
        { name: 'Plex / Jellyfin Direct-Play MP4', spec: '.mp4 · libx264 · yuv420p · High@L4.1 · CRF 19 · AAC 256k · +faststart', why: 'Avoids server transcoding on nearly every TV, Fire Stick, and phone client.' },
        { name: '4K HEVC 10-Bit Direct-Play MKV', spec: '.mkv · libx265 · yuv420p10le · CRF 19 · AC3 5.1 / AAC 256k', why: 'High-efficiency home server streaming for 4K TVs and Shield/Apple TV.' },
        { name: 'Web-Ready 1080p Stream MP4', spec: '.mp4 · libx264 · yuv420p · CRF 20 · Max 8M · AAC 192k · +faststart', why: 'Smooth remote streaming over Wi-Fi or 5G without buffering.' },
        { name: '720p Low-Bandwidth Stream', spec: '.mp4 · libx264 · 720p30 · CRF 22 · Max 3M · AAC 128k · +faststart', why: 'Reliable playback over congested cellular connections.' }
      ],
      audio: [
        { name: 'Opus 192k Transparent', spec: '.opus · libopus · 192 kbps · 48kHz Stereo', why: 'Best perceptual quality per MB on Android, PC, and modern browsers.' },
        { name: 'FLAC 24-Bit Lossless', spec: '.flac · 24-bit · 48kHz · Bit-Exact Lossless', why: 'Studio-exact lossless archive at ~45% smaller size than WAV.' },
        { name: 'AAC-LC 256k (.m4a)', spec: '.m4a · AAC-LC · 256 kbps · 48kHz Stereo', why: 'Clean high frequencies with native Apple, Android, and TV playback.' },
        { name: 'MP3 320k CBR Universal', spec: '.mp3 · libmp3lame · 320 kbps CBR · 44.1kHz Stereo', why: 'Guaranteed to play on every car stereo, phone, and legacy player.' }
      ],
      photo: [
        { name: 'WebP Crisp 85%', spec: '.webp · Q85 · sRGB 4:4:4 · Auto-Orient', why: '~30% smaller than JPG with razor-sharp detail for Android and web.' },
        { name: 'Lossless PNG 24-Bit', spec: '.png · RGB24 Lossless · Keep Original Resolution', why: 'Zero compression artifacts for thumbnails, UI assets, and archival graphics.' },
        { name: 'AVIF Compact Q75', spec: '.avif · Q75 · 1920px · sRGB 4:2:0', why: 'Smallest next-gen photo format for tight storage and fast web galleries.' },
        { name: 'JPG High 92% Universal', spec: '.jpg · Q92 · sRGB 4:4:4 · Auto-Orient', why: 'Opens on 100% of devices, editors, TVs, and print labs.' }
      ],
      balanced: [
        { name: 'H.264 Balanced Master (CRF 19)', spec: '.mp4 · libx264 · yuv420p · CRF 19 · preset fast · AAC 192k · +faststart', why: 'Ideal everyday balance of sharp detail, fast encode speed, and universal playback.' },
        { name: 'HEVC 8-Bit Balanced (CRF 20)', spec: '.mp4 · libx265 · yuv420p · tag hvc1 · CRF 20 · AAC 192k · +faststart', why: 'Saves ~35% space with crisp clarity across modern phones and TVs.' },
        { name: 'Opus 192k Balanced Audio', spec: '.opus · libopus · 192 kbps · 48kHz Stereo', why: 'Transparent listening quality at a fraction of FLAC file size.' },
        { name: 'WebP 85% Balanced Image', spec: '.webp · Q85 · sRGB 4:4:4 · Auto-Orient', why: 'Clean visual quality with ~30% savings over JPEG.' }
      ],
      quality: [
        { name: 'HEVC 10-Bit Master (CRF 16)', spec: '.mkv · libx265 · yuv420p10le · CRF 16 · slower · FLAC Lossless', why: 'Maximum visual fidelity with 10-bit gradient precision and lossless audio.' },
        { name: 'H.264 Visual-Lossless (CRF 15)', spec: '.mp4 · libx264 · yuv420p · CRF 15 · slow · AAC 320k · +faststart', why: 'Indistinguishable from source on 8-bit displays with universal playback.' },
        { name: 'H.264 4:2:2 Pro Intermediate', spec: '.mov · libx264 · yuv422p · Intra -g 1 · CRF 14 · PCM 24-bit', why: 'Highest chroma fidelity for color grading and post-production.' },
        { name: 'FLAC 24-Bit + Lossless PNG', spec: '.flac (24-bit) · .png (RGB24 Lossless)', why: 'Zero lossy compression for audio masters and still frames.' }
      ],
      size: [
        { name: 'AV1 Ultra-Compact (SVT-AV1)', spec: '.mp4 · libsvtav1 · yuv420p · CRF 28 · preset 7 · Opus 96k', why: 'Smallest possible video file size at watchable clarity.' },
        { name: 'HEVC High-Compression MP4', spec: '.mp4 · libx265 · yuv420p · tag hvc1 · CRF 24 · AAC 128k · +faststart', why: 'Cuts file size by 50–65% while staying playable on modern phones & TVs.' },
        { name: '720p30 Compact H.264', spec: '.mp4 · libx264 · 720p30 · CRF 24 · Max 2.5M · AAC 96k · +faststart', why: 'Tiny size with 100% compatibility on older devices and chat apps.' },
        { name: 'Opus 96k + AVIF Q70', spec: '.opus (96k) for Audio · .avif (Q70) for Images', why: 'Minimum storage footprint for audio collections and photo archives.' }
      ],
      speed: [
        { name: 'Instant Stream Copy (-c copy)', spec: '.mp4 / .mkv · -c copy · +faststart (Zero Re-Encode)', why: 'Completes in ~1 second with zero battery drain whenever you only need remuxing, trimming, or scrubbing.' },
        { name: 'H.264 Veryfast Battery-Saver', spec: '.mp4 · libx264 · preset veryfast · CRF 20 · AAC 192k · +faststart', why: 'Encodes up to 3x faster with minimal phone heat and battery draw.' },
        { name: 'H.264 Ultrafast Quick Export', spec: '.mp4 · libx264 · preset ultrafast · CRF 19 · AAC 192k', why: 'Fastest possible software re-encode when time matters most.' },
        { name: 'AAC 192k + JPG Q90 Fast', spec: '.m4a (AAC 192k) · .jpg (Q90)', why: 'Near-instant encoding for audio and image batches.' }
      ],
      compat: [
        { name: 'Universal H.264 8-Bit MP4', spec: '.mp4 · libx264 · yuv420p · Main@L4.0 · CRF 19 · AAC 192k · +faststart', why: 'Plays on 99.9% of phones, Smart TVs, browsers, Windows, Mac, and editors.' },
        { name: 'Legacy 720p30 Safe MP4', spec: '.mp4 · libx264 · yuv420p · Main@L3.1 · 720p30 · CRF 21 · AAC 128k · +faststart', why: 'Guaranteed fallback for car stereos, projectors, and older budget phones.' },
        { name: 'MP3 320k CBR Audio', spec: '.mp3 · libmp3lame · 320 kbps CBR · 44.1kHz Stereo', why: 'Supported by virtually every audio device made in the last 25 years.' },
        { name: 'JPG High 92% sRGB', spec: '.jpg · Q92 · sRGB 4:4:4 · Auto-Orient', why: 'Universally accepted by every gallery, OS, website, and printer.' }
      ],
      raw: [
        { name: 'H.264 All-I Zero-Lag Edit', spec: '.mp4 · libx264 · Intra -g 1 · 0 B-Frames · CRF 15 · AAC 320k', why: 'Zero frame-decode lag when scrubbing forward/backward in mobile editors.' },
        { name: 'H.264 4:2:2 Pro Intermediate', spec: '.mov · libx264 · yuv422p · Intra -g 1 · CRF 14 · PCM 24-bit', why: 'Rich 4:2:2 color sampling and uncompressed PCM for pro grading.' },
        { name: 'Short-GOP 1080p60 Edit', spec: '.mp4 · libx264 · -g 15 · 0 B-Frames · CRF 17 · AAC 256k', why: 'Fast scrubbing at half the storage cost of full All-I.' },
        { name: 'WAV PCM 16-Bit + PNG 24-Bit', spec: '.wav (48kHz PCM) · .png (RGB24 Lossless)', why: 'Uncompressed audio and pixel-exact stills for timeline overlays.' }
      ],
      privacy: [
        { name: 'Forensic Stream Copy (Zero Loss)', spec: 'Same Ext · -c copy · -map_metadata -1 · -map_chapters -1 · +bitexact', why: 'Wipes GPS, device model, timestamps, chapters & encoder fingerprints in 1 second with zero quality loss.' },
        { name: 'Clean Social Re-Encode MP4', spec: '.mp4 · libx264 · CRF 18 · -map_metadata -1 · +bitexact · -sn -dn · +faststart', why: 'Re-encodes cleanly and strips all EXIF, telemetry, subtitle, and vendor data tracks.' },
        { name: 'Clean Audio Scrub (.opus / .mp3)', spec: '-vn · -map_metadata -1 · +bitexact · Opus 192k or MP3 320k', why: 'Removes ID3 tags, album art, and recorder software fingerprints.' },
        { name: 'Clean Photo Scrub (.webp / .jpg)', spec: '-map_metadata -1 · WebP Q85 or JPG Q92', why: 'Erases camera EXIF, lens model, and GPS coordinates before sharing.' }
      ]
    };

    const RANK_META = [
      { rank: '1 · BEST MATCH', cls: 'rank-1', rp: 'rp-1' },
      { rank: '2 · STRONG ALT', cls: 'rank-2', rp: 'rp-2' },
      { rank: '3 · SMART PICK', cls: 'rank-3', rp: 'rp-3' },
      { rank: '4 · SAFE OPTION', cls: 'rank-4', rp: 'rp-4' }
    ];

    function render() {
      const activeEl = document.querySelector('.s-chip.active');
      const lbl = activeEl ? activeEl.textContent.trim() : 'This Device';
      document.getElementById('combo-lbl').textContent = 'Tailored for: ' + lbl;

      const list = activeChoice === 'this_device' ? buildThisDeviceRecs() : (PLAYBOOKS[activeChoice] || PLAYBOOKS.balanced);
      document.getElementById('rec-list').innerHTML = list.slice(0, 4).map((r, idx) => {
        const rm = RANK_META[idx];
        return `
          <article class="rec-card ${rm.cls}">
            <div class="rec-top">
              <span class="rec-name">${r.name}</span>
              <span class="rank-pill ${rm.rp}">${rm.rank}</span>
            </div>
            <div class="rec-spec">${r.spec}</div>
            <div class="rec-why">${r.why}</div>
            <div class="rec-acts">
              <button type="button" class="btn-use" data-act="use" data-name="${r.name}">Use Preset ↗</button>
              <button type="button" class="btn-sec" data-act="save" data-name="${r.name}">Save Preset</button>
              <button type="button" class="btn-sec" data-act="test" data-name="${r.name}">Test Sample ↗</button>
            </div>
          </article>
        `;
      }).join('');
    }

    // Mutually exclusive single selection across ALL 3 groups (Device, Purpose, Priority)
    document.querySelector('main.content').addEventListener('click', (e) => {
      const chip = e.target.closest('.s-chip');
      if (!chip) return;
      document.querySelectorAll('.s-chip').forEach(x => x.classList.remove('active'));
      chip.classList.add('active');
      activeChoice = chip.getAttribute('data-val') || 'this_device';
      render();
    });

    document.getElementById('rec-list').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      const act = b.getAttribute('data-act');
      const name = b.getAttribute('data-name');
      if (act === 'use') showToast('Loaded ' + name + ' into Master Studio →');
      if (act === 'save') {
        if (window.AndroidBridge && window.AndroidBridge.savePreset) {
          const cat = activeChoice === 'audio' ? 'Audio' : (activeChoice === 'photo' ? 'Image' : 'Video');
          window.AndroidBridge.savePreset(JSON.stringify({ name: name, category: cat }));
        }
        showToast('Saved ' + name + ' to Presets Hub ✓');
      }
      if (act === 'test') showToast('Opening Sample Tester with ' + name + ' →');
    });

    document.getElementById('btn-back').addEventListener('click', () => showToast('← Returns to Home'));
    loadDeviceTelemetry();
    render();
  </script>
</body>
</html>
