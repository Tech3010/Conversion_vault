<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Conversion Vault · Queue &amp; History</title>
  <style>
    :root {
      /* Red Bull Racing Dark Mode (shadcn/ui precision tokens) */
      --bg: #090d16;
      --surface: #0f1624;
      --card: #131c2e;
      --card-elev: #172236;
      --input: #0a0f1a;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --subtle: #64748b;
      --crimson: #db0a40;
      --crimson-soft: rgba(219, 10, 64, 0.14);
      --crimson-hover: #be0837;
      --gold: #fcd116;
      --gold-soft: rgba(252, 209, 22, 0.13);
      --gold-text: #fcd116;
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --radius: 12px;
      --radius-sm: 8px;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13.5px;
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-frame {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      padding-bottom: 78px;
    }
    @media (min-width: 600px) {
      .app-frame { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    }

    /* Top App Bar (Clean — No Theme Toggle) */
    .app-bar {
      position: sticky; top: 0; z-index: 30;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .page-title { font-size: 15.5px; font-weight: 800; line-height: 1.2; }
    .page-sub { font-size: 10.5px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
    .btn-clear-hdr {
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--muted); font-family: var(--mono);
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .btn-clear-hdr:hover { border-color: var(--crimson); color: var(--crimson); }

    .content { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

    /* Segmented Root Tabs (Active Queue vs History) */
    .seg-tabs {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px;
    }
    .seg-tab {
      padding: 8px 6px; border: none; border-radius: 7px; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer;
      display: inline-flex; justify-content: center; align-items: center; gap: 6px;
    }
    .seg-tab.active { background: var(--crimson); color: #ffffff; }
    .seg-cnt {
      font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
    }

    /* Filter Chips (History) */
    .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .f-chip {
      padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--muted); font-family: var(--mono);
      font-size: 10.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .f-chip.active { background: var(--gold-soft); border-color: rgba(252, 209, 22, 0.55); color: var(--gold-text); }

    /* Job & History Cards */
    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .job-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; transition: border-color 0.15s ease;
    }
    .job-card.is-run { border-color: rgba(219, 10, 64, 0.7); box-shadow: inset 3px 0 0 var(--crimson); }
    .job-card.is-done { box-shadow: inset 3px 0 0 var(--emerald); }
    .job-card.is-fail { box-shadow: inset 3px 0 0 var(--gold); }

    .job-main { padding: 12px 13px; display: flex; flex-direction: column; gap: 8px; }
    .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .job-title { font-family: var(--mono); font-size: 12.5px; font-weight: 700; word-break: break-all; }
    .job-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }

    .status-pill {
      font-family: var(--mono); font-size: 10px; font-weight: 800; padding: 3px 7px;
      border-radius: 5px; white-space: nowrap;
    }
    .sp-run { background: var(--crimson-soft); color: var(--crimson); }
    .sp-wait { background: var(--card-elev); border: 1px solid var(--border-strong); color: var(--muted); }
    .sp-done { background: var(--emerald-soft); color: var(--emerald); }
    .sp-fail { background: var(--gold-soft); color: var(--gold-text); }

    .prog-track { width: 100%; height: 6px; background: var(--input); border-radius: 999px; overflow: hidden; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, var(--crimson), var(--gold)); border-radius: 999px; transition: width 0.2s ease; }

    .job-metrics {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    }
    .c-emerald { color: var(--emerald); font-weight: 700; }
    .c-gold { color: var(--gold-text); font-weight: 700; }

    .job-actions { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
    .btn-sm {
      padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border-strong);
      background: var(--card-elev); color: var(--text); font-family: var(--mono);
      font-size: 10.5px; font-weight: 700; cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--crimson); color: var(--crimson); }
    .btn-sm.primary { background: var(--crimson); border-color: var(--crimson); color: #ffffff; }
    .btn-sm.primary:hover { background: var(--crimson-hover); }

    /* Expandable History Drawer */
    .hist-drawer {
      background: #05070b; border-top: 1px dashed var(--border-strong); padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
      font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    }
    .cmd-box {
      background: var(--input); border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 9px; color: var(--gold-text); word-break: break-all; line-height: 1.45;
    }

    .empty-box {
      background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius);
      padding: 26px 16px; text-align: center; color: var(--muted); font-size: 12.5px;
    }

    /* Bottom Navigation Bar (3 Roots: Home · Queue & History · Settings) */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 540px; height: 66px;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 6px 4px; gap: 4px;
      display: grid; grid-template-columns: repeat(5, 1fr); z-index: 40;
    }
    .nav-item {
      border: 1px solid transparent; border-radius: 11px;
      background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 4px 2px; font-size: 9.8px; font-weight: 700; cursor: pointer;
      -webkit-tap-highlight-color: transparent; outline: none;
    }
    .nav-item.active {
      color: var(--crimson);
      background: var(--crimson-soft);
      border-color: rgba(219, 10, 64, 0.50);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 10px rgba(219, 10, 64, 0.18);
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(5, 8, 15, 0.78);
      display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    .confirm-sheet {
      width: 100%; max-width: 380px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .confirm-title { font-size: 15px; font-weight: 800; color: var(--text); }
    .confirm-desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .btn-danger-solid {
      padding: 8px 14px; border-radius: 7px; border: 1px solid var(--crimson);
      background: var(--crimson); color: #ffffff; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-danger-solid:hover { background: var(--crimson-hover); }

    .sub-filter-row { display: flex; gap: 5px; overflow-x: auto; padding-left: 2px; }
    .sf-chip {
      padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card); color: var(--muted); font-family: var(--mono);
      font-size: 10px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .sf-chip.active { border-color: var(--crimson); background: var(--crimson-soft); color: var(--crimson); }
    .mod-tag {
      font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; background: var(--card-elev); border: 1px solid var(--border-strong); color: var(--gold-text);
      display: inline-block; margin-bottom: 3px;
    }
    .hidden { display: none !important; }
    .toast {
      position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px;
      font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 120;
    }
    .toast.show { opacity: 1; }
  </style>
  <script>
    (function(){
      try {
        var t = (window.AndroidBridge && window.AndroidBridge.getAppState && window.AndroidBridge.getAppState('cv_theme')) || localStorage.getItem('cv_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="app-frame">
    <!-- Top App Bar -->
    <header class="app-bar">
      <div>
        <div class="page-title">Queue &amp; History</div>
        <div class="page-sub">ACTIVE ENGINE RUNS &amp; COMPLETED EXPORTS</div>
      </div>
    </header>

    <main class="content">
      <!-- 2-Tab Switcher -->
      <div class="seg-tabs" role="tablist">
        <button type="button" class="seg-tab active" data-view="queue">
          <span>Active Queue</span>
          <span class="seg-cnt" id="cnt-queue">0</span>
        </button>
        <button type="button" class="seg-tab" data-view="history">
          <span>History</span>
          <span class="seg-cnt" id="cnt-hist">0</span>
        </button>
      </div>

      <!-- Search Bar for Active Queue & History -->
      <div style="position:relative; display:flex; align-items:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:11px; pointer-events:none;">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="inp-qh-search" placeholder="Search files, formats, or status..." autocomplete="off" style="width:100%; padding:9px 34px 9px 34px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12.5px; outline:none;">
        <button type="button" id="btn-qh-search-clear" class="hidden" aria-label="Clear search" style="position:absolute; right:8px; border:none; background:var(--card-elev); color:var(--muted); width:22px; height:22px; border-radius:50%; font-size:13px; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;">×</button>
      </div>

      <!-- Sort & File-Manager Multi-Select Toolbar -->
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <button type="button" id="btn-toggle-select" class="btn-sm" style="padding:6px 12px;">☑ Select</button>
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase;">Sort</span>
          <select id="sel-sort-jobs" style="padding:6px 10px; border-radius:8px; background:var(--card); color:var(--text); border:1px solid var(--border); font-size:12px; font-weight:600;">
            <option value="date_desc" selected>Date (Newest)</option>
            <option value="date_asc">Date (Oldest)</option>
            <option value="name_asc">Name (A → Z)</option>
            <option value="name_desc">Name (Z → A)</option>
            <option value="size_desc">Size (Largest)</option>
            <option value="size_asc">Size (Smallest)</option>
          </select>
        </div>
      </div>

      <!-- Multi-Select Action Bar (File-Manager Style) -->
      <div id="multi-select-bar" class="hidden" style="display:flex; flex-direction:column; gap:8px; padding:10px 12px; border-radius:10px; border:1px solid rgba(219,10,64,0.45); background:rgba(219,10,64,0.08);">
        <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px;">
          <strong id="lbl-sel-count" style="font-size:12px; color:var(--text);">0 Selected</strong>
          <div style="display:flex; flex-wrap:wrap; gap:5px;">
            <button type="button" id="btn-sel-all" class="btn-sm">All</button>
            <button type="button" id="btn-sel-none" class="btn-sm">None</button>
            <button type="button" id="btn-sel-invert" class="btn-sm">Invert</button>
            <button type="button" id="btn-sel-failed" class="btn-sm">Failed/Cancelled</button>
          </div>
        </div>
        <div id="multi-sel-actions" style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;"></div>
      </div>

      <!-- ACTIVE QUEUE VIEW -->
      <section id="view-queue" class="card-list" aria-label="Active Queue"></section>

      <!-- HISTORY VIEW -->
      <section id="view-history" class="hidden" style="display:flex; flex-direction:column; gap:10px;" aria-label="Conversion History">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <div class="filter-row" id="hist-filters" style="flex:1;">
            <button type="button" class="f-chip active" data-filter="all">All</button>
            <button type="button" class="f-chip" data-filter="vault_core">Conversion Engine</button>
            <button type="button" class="f-chip" data-filter="metadata">Metadata Modifier</button>
            <button type="button" class="f-chip" data-filter="compressor">Target Compressor</button>
            <button type="button" class="f-chip" data-filter="samples">Sample Tester</button>
            <button type="button" class="f-chip" data-filter="cancelled">Cancelled</button>
          </div>
          <button type="button" id="btn-clear-hist" class="btn-clear-hdr">Clear</button>
        </div>
        <div class="sub-filter-row hidden" id="vault-subfilters">
          <button type="button" class="sf-chip active" data-subfilter="all">All Engine</button>
          <button type="button" class="sf-chip" data-subfilter="video">Videos</button>
          <button type="button" class="sf-chip" data-subfilter="audio">Audios</button>
          <button type="button" class="sf-chip" data-subfilter="image">Images</button>
        </div>
        <div class="card-list" id="hist-list"></div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <button type="button" class="nav-item " data-nav="home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>
      <button type="button" class="nav-item active" data-nav="queue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>Queue</span>
      </button>
      <button type="button" class="nav-item " data-nav="presets">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>Presets</span>
      </button>
      <button type="button" class="nav-item" data-nav="workflows">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 6h6"/><path d="M6 9v3a6 6 0 0 0 6 6h3"/>
        </svg>
        <span>Workflows</span>
      </button>
      <button type="button" class="nav-item " data-nav="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Clear History Confirmation Modal -->
  <div class="modal-backdrop hidden" id="confirm-modal" role="dialog" aria-modal="true" aria-label="Confirm Clear History">
    <div class="confirm-sheet">
      <div class="confirm-title" id="confirm-title">Clear Conversion History?</div>
      <div class="confirm-desc" id="confirm-desc">This will permanently remove all conversion logs from History. Your converted files on device storage will not be deleted.</div>
      <div class="confirm-actions">
        <button type="button" id="btn-confirm-cancel" class="btn-sm">Cancel</button>
        <button type="button" id="btn-confirm-yes" class="btn-danger-solid">Yes, Clear History</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Ready</div>

  <script>
    const state = {
      view: 'queue',
      filter: 'all',
      subFilter: 'all',
      sortBy: 'date_desc',
      query: '',
      bundleOpen: false,
      selectMode: false,
      selectedIds: new Set(),
      openBatchIds: new Set(),
      pendingConfirm: null,
      openIds: new Set(),
      userPickedTab: false,
      batchesMeta: [],
      queue: [],
      history: []
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    function esc(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtSize(bytes) {
      if (!bytes || bytes <= 0) return '—';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function mapModuleKey(mod) {
      const m = String(mod || '').toLowerCase();
      if (m.includes('metadata')) return ['metadata', 'Metadata Modifier'];
      if (m.includes('compress')) return ['compressor', 'Target Compressor'];
      if (m.includes('audio')) return ['audio_tool', 'Audio Extract & Mute'];
      if (m.includes('trim') || m.includes('gif')) return ['trim_gif', 'Trim & GIF'];
      if (m.includes('thumb')) return ['thumb', 'Thumbnail Capturer'];
      if (m.includes('sample')) return ['samples', 'Sample Tester'];
      return ['vault_core', 'Conversion Engine'];
    }

    function fmtWhen(ts) {
      if (!ts) return 'Recently';
      try {
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      } catch (_) { return 'Recently'; }
    }

    function sortItems(arr) {
      const copy = arr.slice();
      const mode = state.sortBy || 'date_desc';
      copy.sort((a, b) => {
        if (mode === 'name_asc') return String(a.title || '').localeCompare(String(b.title || ''), undefined, { sensitivity: 'base' });
        if (mode === 'name_desc') return String(b.title || '').localeCompare(String(a.title || ''), undefined, { sensitivity: 'base' });
        if (mode === 'size_desc') return (b.sizeBytes || 0) - (a.sizeBytes || 0);
        if (mode === 'size_asc') return (a.sizeBytes || 0) - (b.sizeBytes || 0);
        if (mode === 'date_asc') return (a.createdAt || 0) - (b.createdAt || 0);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
      return copy;
    }

    function loadJobsFromNative() {
      if (!window.AndroidBridge || typeof window.AndroidBridge.getJobs !== 'function') {
        render();
        return;
      }
      try {
        const raw = JSON.parse(window.AndroidBridge.getJobs('ALL', 'ALL') || '[]');
        const q = [];
        const h = [];
        raw.forEach(j => {
          const id = String(j.id);
          const [modKey, modLabel] = mapModuleKey(j.module);
          const cat = String(j.mediaType || 'Video').toLowerCase();
          const outPath = j.outputPath || '';
          const title = (outPath || j.inputPath || 'Media Job').split('/').pop();
          const st = String(j.status || '').toUpperCase();
          const sizeBytes = Number(j.outputSizeBytes || j.inputSizeBytes || 0);
          const createdAt = Number(j.createdAt || 0);

          if (st === 'RUNNING' || st === 'QUEUED' || st === 'PAUSED') {
            q.push({
              id: id,
              title: title,
              sub: modLabel + ' · ' + (j.mediaType || 'Media') + (sizeBytes > 0 ? (' · ' + fmtSize(sizeBytes)) : ''),
              dest: outPath,
              status: st === 'RUNNING' ? 'running' : (st === 'PAUSED' ? 'paused' : 'queued'),
              pct: j.progressPct || 0,
              sizeBytes: sizeBytes,
              createdAt: createdAt,
              speed: st === 'RUNNING' ? ((j.fps ? Math.round(j.fps) + ' fps · ' : '') + (j.speed || 'Encoding...'))
                   : (st === 'PAUSED' ? 'Paused — tap Resume' : 'Waiting in queue')
            });
          } else {
            h.push({
              id: id,
              mod: modKey,
              modLabel: modLabel,
              cat: cat.includes('aud') ? 'audio' : (cat.includes('img') || cat.includes('ima') ? 'image' : 'video'),
              status: st === 'DONE' ? 'done' : (st === 'CANCELLED' ? 'cancelled' : 'failed'),
              open: state.openIds.has(id),
              title: title,
              when: fmtWhen(createdAt),
              sizeBytes: sizeBytes,
              createdAt: createdAt,
              preset: modLabel + ' · ' + (j.mediaType || 'Media') + (sizeBytes > 0 ? (' · ' + fmtSize(sizeBytes)) : ''),
              delta: st === 'DONE' ? ('Saved cleanly · ' + fmtSize(sizeBytes)) : (st === 'CANCELLED' ? 'Cancelled by user' : 'Failed — tap Details ▾'),
              dest: outPath,
              inputPath: j.inputPath || '',
              cmd: j.errorLog ? ('ERROR: ' + j.errorLog) : ('Output: ' + outPath)
            });
          }
        });
        state.queue = q;
        state.history = h;
        try {
          const bRaw = (window.AndroidBridge && window.AndroidBridge.getAppState && window.AndroidBridge.getAppState('cv_batches_meta')) || localStorage.getItem('cv_batches_meta') || '[]';
          state.batchesMeta = JSON.parse(bRaw || '[]');
        } catch (_) { state.batchesMeta = []; }

        if (!state.userPickedTab) {
          state.view = (q.length > 0) ? 'queue' : (h.length > 0 ? 'history' : 'queue');
        }
      } catch (_) {}
      render();
    }

    function matchesQuery(item) {
      const q = String(state.query || '').trim().toLowerCase();
      if (!q) return true;
      const hay = [item.title, item.sub, item.preset, item.dest, item.status, item.modLabel, item.cat].join(' ').toLowerCase();
      return hay.includes(q);
    }

    function getVisibleQueueItems() {
      return sortItems(state.queue.filter(matchesQuery));
    }

    function getVisibleHistoryItems() {
      const filteredHist = state.history.filter(h => {
        if (!matchesQuery(h)) return false;
        if (state.filter === 'all') return true;
        if (state.filter === 'cancelled') return h.status === 'cancelled';
        if (state.filter === 'vault_core') {
          if (h.mod !== 'vault_core') return false;
          return state.subFilter === 'all' ? true : h.cat === state.subFilter;
        }
        return h.mod === state.filter;
      });
      return sortItems(filteredHist);
    }

    function updateMultiSelectBar() {
      const bar = document.getElementById('multi-select-bar');
      const btnToggle = document.getElementById('btn-toggle-select');
      const cntEl = document.getElementById('lbl-sel-count');
      const actEl = document.getElementById('multi-sel-actions');
      if (btnToggle) btnToggle.textContent = state.selectMode ? '✕ Done' : '☑ Select';
      if (!bar || !actEl) return;
      bar.classList.toggle('hidden', !state.selectMode);
      if (!state.selectMode) return;
      const n = state.selectedIds.size;
      if (cntEl) cntEl.textContent = n + ' Selected';
      const fBtn = document.getElementById('btn-sel-failed');
      if (fBtn) fBtn.textContent = state.view === 'queue' ? 'Paused Only' : 'Failed/Cancelled';
      if (state.view === 'queue') {
        actEl.innerHTML =
          '<button type="button" class="btn-sm" style="border-color:rgba(219,10,64,0.5); color:var(--crimson);" data-bulk="cancel-sel" ' + (n === 0 ? 'disabled' : '') + '>■ Stop Selected (' + n + ')</button>';
      } else {
        actEl.innerHTML =
          '<button type="button" class="btn-sm" data-bulk="del-logs" ' + (n === 0 ? 'disabled' : '') + '>Delete Logs (' + n + ')</button>' +
          '<button type="button" class="btn-sm" style="border-color:rgba(219,10,64,0.5); color:var(--crimson);" data-bulk="del-files" ' + (n === 0 ? 'disabled' : '') + '>Delete Files (' + n + ')</button>';
      }
    }

    function render() {
      document.querySelectorAll('.seg-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === state.view));
      document.getElementById('view-queue').classList.toggle('hidden', state.view !== 'queue');
      document.getElementById('view-history').classList.toggle('hidden', state.view !== 'history');
      document.getElementById('cnt-queue').textContent = String(state.queue.length);
      document.getElementById('cnt-hist').textContent = String(state.history.length);
      document.getElementById('btn-clear-hist').classList.toggle('hidden', state.history.length === 0);
      updateMultiSelectBar();

      // Render Active Queue (Bundled Batch Queue when >1 files; Cancel ONLY, no Remove!)
      const qWrap = document.getElementById('view-queue');
      const visibleQueue = getVisibleQueueItems();
      const hasSearch = !!String(state.query || '').trim();
      if (state.queue.length === 0) {
        qWrap.innerHTML = '<div class="empty-box">No active conversions running right now.' + (state.history.length ? ' Tap <strong>History</strong> above to see your finished or cancelled files.' : '') + '</div>';
      } else if (visibleQueue.length === 0) {
        qWrap.innerHTML = '<div class="empty-box">No queued files match <strong>&ldquo;' + esc(state.query.trim()) + '&rdquo;</strong>.</div>';
      } else if (state.queue.length > 1) {
        const runningItem = state.queue.find(x => x.status === 'running') || null;
        const pausedCnt = state.queue.filter(x => x.status === 'paused').length;
        const queuedCnt = state.queue.filter(x => x.status === 'queued').length;
        const isBatchPaused = !runningItem && pausedCnt > 0;
        const sortedQueue = visibleQueue;
        const targetOpenId = (runningItem && runningItem.id) || sortedQueue[0].id;
        const activePct = runningItem ? Math.max(4, runningItem.pct || 0) : 0;
        const showFiles = state.bundleOpen || state.selectMode || hasSearch;

        qWrap.innerHTML = `
          <div class="job-card ${isBatchPaused ? '' : 'is-run'}">
            <div class="job-main">
              <div class="job-top">
                <div style="min-width:0;">
                  <span class="mod-tag">BUNDLED BATCH QUEUE</span>
                  <div class="job-title">Batch Conversion · ${state.queue.length} Files</div>
                  <div class="job-sub">${runningItem ? ('Now converting: ' + esc(runningItem.title)) : (isBatchPaused ? 'Batch paused — tap Resume Batch to continue' : (queuedCnt + ' files queued in order'))}</div>
                </div>
                <span class="status-pill ${isBatchPaused ? 'sp-wait' : 'sp-run'}">${isBatchPaused ? 'PAUSED' : (runningItem ? (runningItem.pct + '%') : 'QUEUED')}</span>
              </div>
              ${runningItem ? `<div class="prog-track"><div class="prog-fill" style="width:${activePct}%;"></div></div>` : ''}
              <div class="job-metrics">
                <span>${runningItem ? esc(runningItem.speed) : (pausedCnt + ' paused · ' + queuedCnt + ' queued')}</span>
                <span>${state.queue.length} remaining</span>
              </div>
              <div class="job-actions">
                <button type="button" class="btn-sm primary" data-qact="open-batch" data-id="${esc(targetOpenId)}">Open Engine ↗</button>
                <button type="button" class="btn-sm" data-qact="folder" data-id="${esc(targetOpenId)}">File Manager ↗</button>
                ${isBatchPaused
                  ? `<button type="button" class="btn-sm primary" data-qact="resume-batch">▶ Restart Batch</button>`
                  : ''}
                <button type="button" class="btn-sm" style="border-color:rgba(219,10,64,0.45); color:var(--crimson);" data-qact="cancel-batch">■ Stop Batch</button>
                <button type="button" class="btn-sm" data-qact="toggle-bundle">${showFiles ? 'Hide Files ▴' : ('Files (' + state.queue.length + ') ▾')}</button>
              </div>
            </div>
            ${showFiles ? `
              <div class="hist-drawer" style="display:flex; flex-direction:column; gap:6px;">
                ${sortedQueue.map((q, idx) => `
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; border:1px solid var(--border); background:var(--card);">
                    <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                      ${state.selectMode ? `<input type="checkbox" data-sel-id="${esc(q.id)}" ${state.selectedIds.has(q.id) ? 'checked' : ''} style="width:16px; height:16px; accent-color:var(--crimson);">` : ''}
                      <div style="min-width:0;">
                        <div style="font-size:12px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">#${idx + 1} · ${esc(q.title)}</div>
                        <div style="font-size:10.5px; color:var(--muted);">${esc(q.sub)} · ${q.status.toUpperCase()}</div>
                      </div>
                    </div>
                    <div style="display:flex; gap:6px; flex-shrink:0;">
                      ${q.status === 'paused' ? `<button type="button" class="btn-sm primary" data-qact="resume" data-id="${esc(q.id)}">▶ Resume</button>` : ''}
                      <button type="button" class="btn-sm" data-qact="cancel" data-id="${esc(q.id)}">■ Stop</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      } else {
        const sortedQueue = visibleQueue;
        qWrap.innerHTML = sortedQueue.map(q => {
          const isRun = q.status === 'running';
          const isPaused = q.status === 'paused';
          return `
            <div class="job-card ${isRun ? 'is-run' : ''}" data-job-id="${esc(q.id)}">
              <div class="job-main">
                <div class="job-top">
                  <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                    ${state.selectMode ? `<input type="checkbox" data-sel-id="${esc(q.id)}" ${state.selectedIds.has(q.id) ? 'checked' : ''} style="width:16px; height:16px; accent-color:var(--crimson);">` : ''}
                    <div style="min-width:0;">
                      <div class="job-title">${esc(q.title)}</div>
                      <div class="job-sub">${esc(q.sub)}</div>
                    </div>
                  </div>
                  <span class="status-pill ${isRun ? 'sp-run' : 'sp-wait'}">${isRun ? (q.pct + '%') : (isPaused ? 'PAUSED' : 'QUEUED')}</span>
                </div>
                ${isRun ? `<div class="prog-track"><div class="prog-fill" style="width:${Math.max(4, q.pct)}%;"></div></div>` : ''}
                <div class="job-metrics">
                  <span>${esc(q.speed)}</span>
                  <span style="word-break:break-all;">→ ${esc(q.dest)}</span>
                </div>
                <div class="job-actions">
                  <button type="button" class="btn-sm primary" data-qact="open" data-id="${esc(q.id)}">Open Engine ↗</button>
                  <button type="button" class="btn-sm" data-qact="folder" data-id="${esc(q.id)}">File Manager ↗</button>
                  ${isPaused
                    ? `<button type="button" class="btn-sm primary" data-qact="resume" data-id="${esc(q.id)}">▶ Restart</button>`
                    : ''}
                  <button type="button" class="btn-sm" style="border-color:rgba(219,10,64,0.45); color:var(--crimson);" data-qact="cancel" data-id="${esc(q.id)}">■ Stop</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Render History (with Bundled Cancelled Batches + File-Manager Multi-Select!)
      document.querySelectorAll('.f-chip').forEach(c => c.classList.toggle('active', c.getAttribute('data-filter') === state.filter));
      const subBar = document.getElementById('vault-subfilters');
      subBar.classList.toggle('hidden', state.filter !== 'vault_core');
      document.querySelectorAll('.sf-chip').forEach(c => c.classList.toggle('active', c.getAttribute('data-subfilter') === state.subFilter));

      const items = getVisibleHistoryItems();
      const hWrap = document.getElementById('hist-list');
      if (items.length === 0) {
        hWrap.innerHTML = '<div class="empty-box">No conversion history matches this filter.</div>';
        return;
      }

      // Group cancelled jobs belonging to a batch into Bundled Cancelled Batch cards
      const cancelledById = {};
      items.filter(h => h.status === 'cancelled').forEach(h => { cancelledById[h.id] = h; });
      const groupedIds = new Set();
      const cancelledBatches = [];

      (state.batchesMeta || []).forEach(b => {
        const members = (b.jobIds || []).map(id => cancelledById[String(id)]).filter(Boolean);
        if (members.length >= 2) {
          members.forEach(m => groupedIds.add(m.id));
          cancelledBatches.push({
            batchId: b.batchId,
            createdAt: b.createdAt || (members[0] && members[0].createdAt) || 0,
            members: sortItems(members)
          });
        }
      });

      // Fallback grouping: if >=2 ungrouped cancelled items were created within 3 seconds of each other, bundle them too!
      const ungroupedCancelled = items.filter(h => h.status === 'cancelled' && !groupedIds.has(h.id));
      if (ungroupedCancelled.length >= 2) {
        const byTime = ungroupedCancelled.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        let curGrp = [byTime[0]];
        for (let i = 1; i < byTime.length; i++) {
          if (Math.abs((byTime[i].createdAt || 0) - (byTime[i - 1].createdAt || 0)) <= 4000) {
            curGrp.push(byTime[i]);
          } else {
            if (curGrp.length >= 2) {
              curGrp.forEach(m => groupedIds.add(m.id));
              cancelledBatches.push({ batchId: 'auto_' + curGrp[0].id, createdAt: curGrp[0].createdAt || 0, members: sortItems(curGrp) });
            }
            curGrp = [byTime[i]];
          }
        }
        if (curGrp.length >= 2) {
          curGrp.forEach(m => groupedIds.add(m.id));
          cancelledBatches.push({ batchId: 'auto_' + curGrp[0].id, createdAt: curGrp[0].createdAt || 0, members: sortItems(curGrp) });
        }
      }

      const batchHtml = cancelledBatches.map(b => {
        const isOpen = state.openBatchIds.has(b.batchId);
        const totalBytes = b.members.reduce((acc, m) => acc + (m.sizeBytes || 0), 0);
        const allChecked = b.members.every(m => state.selectedIds.has(m.id));
        const idsAttr = esc(JSON.stringify(b.members.map(m => m.id)));
        return `
          <div class="job-card is-fail">
            <div class="job-main">
              <div class="job-top">
                <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                  ${state.selectMode ? `<input type="checkbox" data-sel-batch="${idsAttr}" ${allChecked ? 'checked' : ''} style="width:16px; height:16px; accent-color:var(--crimson);">` : ''}
                  <div style="min-width:0;">
                    <span class="mod-tag">CANCELLED BATCH</span>
                    <div class="job-title">Cancelled Batch · ${b.members.length} Files</div>
                    <div class="job-sub">${fmtWhen(b.createdAt)}${totalBytes > 0 ? (' · ' + fmtSize(totalBytes)) : ''}</div>
                  </div>
                </div>
                <span class="status-pill sp-fail">CANCELLED</span>
              </div>
              <div class="job-actions">
                <button type="button" class="btn-sm primary" data-qact="resume-cancelled-batch" data-ids="${idsAttr}">▶ Resume Batch</button>
                <button type="button" class="btn-sm" data-qact="toggle-cancel-batch" data-bid="${esc(b.batchId)}">${isOpen ? 'Hide Files ▴' : ('Files (' + b.members.length + ') ▾')}</button>
              </div>
            </div>
            ${isOpen ? `
              <div class="hist-drawer" style="display:flex; flex-direction:column; gap:6px;">
                ${b.members.map((m, idx) => `
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; border:1px solid var(--border); background:var(--card);">
                    <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                      ${state.selectMode ? `<input type="checkbox" data-sel-id="${esc(m.id)}" ${state.selectedIds.has(m.id) ? 'checked' : ''} style="width:16px; height:16px; accent-color:var(--crimson);">` : ''}
                      <div style="min-width:0;">
                        <div style="font-size:12px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">#${idx + 1} · ${esc(m.title)}</div>
                        <div style="font-size:10.5px; color:var(--muted);">${esc(m.preset)}</div>
                      </div>
                    </div>
                    <button type="button" class="btn-sm primary" data-qact="resume" data-id="${esc(m.id)}">▶ Resume</button>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      const singleItems = items.filter(h => !groupedIds.has(h.id));
      const singlesHtml = singleItems.map(h => `
        <div class="job-card ${h.status === 'done' ? 'is-done' : 'is-fail'}">
          <div class="job-main">
            <div class="job-top">
              <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                ${state.selectMode ? `<input type="checkbox" data-sel-id="${esc(h.id)}" ${state.selectedIds.has(h.id) ? 'checked' : ''} style="width:16px; height:16px; accent-color:var(--crimson);">` : ''}
                <div style="min-width:0;">
                  <span class="mod-tag">${esc(h.modLabel)}</span>
                  <div class="job-title">${esc(h.title)}</div>
                  <div class="job-sub">${esc(h.preset)} · ${esc(h.when)}</div>
                </div>
              </div>
              <span class="status-pill ${h.status === 'done' ? 'sp-done' : 'sp-fail'}">${h.status.toUpperCase()}</span>
            </div>
            <div class="job-metrics">
              <span class="${h.status === 'done' ? 'c-emerald' : 'c-gold'}">${esc(h.delta)}</span>
            </div>
            <div class="job-actions">
              ${h.status === 'done' ? `<button type="button" class="btn-sm primary" data-hact="open" data-id="${esc(h.id)}">Open ▶</button>` : ''}
              ${h.status === 'done' ? `<button type="button" class="btn-sm" data-hact="share" data-id="${esc(h.id)}">Share ↗</button>` : ''}
              ${h.status === 'done' ? `<button type="button" class="btn-sm" data-hact="folder" data-id="${esc(h.id)}">File Manager ↗</button>` : ''}
              ${h.status !== 'done' ? `<button type="button" class="btn-sm primary" data-qact="resume" data-id="${esc(h.id)}">▶ Resume</button>` : ''}
              <button type="button" class="btn-sm" data-hact="toggle" data-id="${esc(h.id)}">${h.open ? 'Hide ▴' : 'Details ▾'}</button>
            </div>
          </div>
          ${h.open ? `
            <div class="hist-drawer">
              <div style="word-break:break-all;"><strong>Saved To:</strong> ${esc(h.dest)}</div>
              <div class="cmd-box" style="word-break:break-word;">${esc(h.cmd)}</div>
              <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button type="button" class="btn-sm" data-hact="delete" data-id="${esc(h.id)}">Remove Log</button>
                ${h.status === 'done' ? `<button type="button" class="btn-sm" style="border-color:rgba(219,10,64,0.5); color:var(--crimson);" data-hact="delfile" data-id="${esc(h.id)}">Delete File</button>` : ''}
              </div>
            </div>
          ` : ''}
        </div>
      `).join('');

      hWrap.innerHTML = batchHtml + singlesHtml;
    }

    window.refreshVaultQueueHistory = function() {
      document.getElementById('btn-toggle-select')?.addEventListener('click', () => {
      state.selectMode = !state.selectMode;
      state.selectedIds.clear();
      render();
    });
    document.getElementById('btn-sel-all')?.addEventListener('click', () => {
      const list = state.view === 'queue' ? getVisibleQueueItems() : getVisibleHistoryItems();
      list.forEach(it => state.selectedIds.add(it.id));
      render();
    });
    document.getElementById('btn-sel-none')?.addEventListener('click', () => {
      state.selectedIds.clear();
      render();
    });
    document.getElementById('btn-sel-invert')?.addEventListener('click', () => {
      const list = state.view === 'queue' ? getVisibleQueueItems() : getVisibleHistoryItems();
      list.forEach(it => {
        if (state.selectedIds.has(it.id)) state.selectedIds.delete(it.id);
        else state.selectedIds.add(it.id);
      });
      render();
    });
    document.getElementById('btn-sel-failed')?.addEventListener('click', () => {
      state.selectedIds.clear();
      if (state.view === 'queue') {
        getVisibleQueueItems().filter(it => it.status === 'paused').forEach(it => state.selectedIds.add(it.id));
      } else {
        getVisibleHistoryItems().filter(it => it.status === 'failed' || it.status === 'cancelled').forEach(it => state.selectedIds.add(it.id));
      }
      render();
    });
    document.addEventListener('change', (e) => {
      const cb = e.target.closest('[data-sel-id]');
      if (cb) {
        const id = cb.getAttribute('data-sel-id');
        if (cb.checked) state.selectedIds.add(id); else state.selectedIds.delete(id);
        updateMultiSelectBar();
        return;
      }
      const bcb = e.target.closest('[data-sel-batch]');
      if (bcb) {
        try {
          const ids = JSON.parse(bcb.getAttribute('data-sel-batch') || '[]');
          ids.forEach(id => { if (bcb.checked) state.selectedIds.add(id); else state.selectedIds.delete(id); });
          render();
        } catch (_) {}
      }
    });
    document.addEventListener('click', (e) => {
      const bk = e.target.closest('[data-bulk]');
      if (!bk || state.selectedIds.size === 0) return;
      const act = bk.getAttribute('data-bulk');
      const ids = Array.from(state.selectedIds);
      if (act === 'cancel-sel' && window.AndroidBridge && window.AndroidBridge.cancelJob) {
        ids.forEach(id => { try { window.AndroidBridge.cancelJob(id); } catch (_) {} });
        state.selectedIds.clear();
        state.selectMode = false;
        showToast('Cancelled ' + ids.length + ' selected job(s)');
        setTimeout(loadJobsFromNative, 250);
      } else if (act === 'del-logs' || act === 'del-files') {
        state.pendingConfirm = { type: act, ids: ids };
        document.getElementById('confirm-title').textContent = act === 'del-files' ? ('Delete ' + ids.length + ' File(s)?') : ('Delete ' + ids.length + ' Log(s)?');
        document.getElementById('confirm-desc').textContent = act === 'del-files'
          ? 'Permanently delete the ' + ids.length + ' selected output file(s) from storage and remove their logs?'
          : 'Remove the ' + ids.length + ' selected log(s) from History? Your files on storage will not be deleted.';
        document.getElementById('btn-confirm-yes').textContent = act === 'del-files' ? 'Yes, Delete Files' : 'Yes, Delete Logs';
        document.getElementById('confirm-modal').classList.remove('hidden');
      }
    });

    loadJobsFromNative();
    };

    const selSort = document.getElementById('sel-sort-jobs');
    if (selSort) {
      selSort.addEventListener('change', () => {
        state.sortBy = selSort.value || 'date_desc';
        render();
      });
    }

    const inpSearch = document.getElementById('inp-qh-search');
    const btnSearchClear = document.getElementById('btn-qh-search-clear');
    if (inpSearch) {
      inpSearch.addEventListener('input', () => {
        state.query = inpSearch.value || '';
        if (btnSearchClear) btnSearchClear.classList.toggle('hidden', !state.query.trim());
        render();
      });
    }
    if (btnSearchClear && inpSearch) {
      btnSearchClear.addEventListener('click', () => {
        inpSearch.value = '';
        state.query = '';
        btnSearchClear.classList.add('hidden');
        render();
        inpSearch.focus();
      });
    }

    const qhPollTimer = setInterval(() => {
      if (document.hidden) return;
      const hasLive = state.queue.some(j => j && (j.status === 'RUNNING' || j.status === 'QUEUED'));
      if (hasLive) loadJobsFromNative();
    }, 1200);
    window.addEventListener('pagehide', () => clearInterval(qhPollTimer));
    window.loadJobsFromNative = loadJobsFromNative;
    (function wireQueueLongPress() {
      let lpTimer = null, lpFired = false, lpStartX = 0, lpStartY = 0;
      document.addEventListener('touchstart', (e) => {
        if (!e.touches || e.touches.length !== 1) return;
        const card = e.target && e.target.closest ? e.target.closest('.job-card[data-job-id]') : null;
        if (!card || e.target.closest('button, input, select')) return;
        const jid = card.getAttribute('data-job-id');
        if (!jid) return;
        lpFired = false;
        lpStartX = e.touches[0].clientX;
        lpStartY = e.touches[0].clientY;
        clearTimeout(lpTimer);
        lpTimer = setTimeout(() => {
          lpFired = true;
          state.selectMode = true;
          if (state.selectedIds.has(jid)) state.selectedIds.delete(jid);
          else state.selectedIds.add(jid);
          if (typeof window.cvHaptic === 'function') window.cvHaptic('heavy');
          render();
          showToast(state.selectedIds.size + ' item(s) selected');
        }, 420);
      }, { passive: true });
      document.addEventListener('touchmove', (e) => {
        if (!lpTimer || !e.touches || e.touches.length !== 1) return;
        if (Math.abs(e.touches[0].clientX - lpStartX) > 12 || Math.abs(e.touches[0].clientY - lpStartY) > 12) {
          clearTimeout(lpTimer); lpTimer = null;
        }
      }, { passive: true });
      const cancelLp = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
      document.addEventListener('touchend', cancelLp, { passive: true });
      document.addEventListener('touchcancel', cancelLp, { passive: true });
      document.addEventListener('click', (e) => {
        if (lpFired) { lpFired = false; e.preventDefault(); e.stopImmediatePropagation(); }
      }, true);
    })();

    document.addEventListener('click', (e) => {
      const st = e.target.closest('.seg-tab');
      if (st) {
        state.userPickedTab = true;
        state.view = st.getAttribute('data-view');
        loadJobsFromNative();
        return;
      }

      const fc = e.target.closest('.f-chip');
      if (fc) { state.filter = fc.getAttribute('data-filter'); state.subFilter = 'all'; render(); return; }
      const sfc = e.target.closest('.sf-chip');
      if (sfc) { state.subFilter = sfc.getAttribute('data-subfilter'); render(); return; }

      const qa = e.target.closest('[data-qact]');
      if (qa) {
        const act = qa.getAttribute('data-qact');
        const id = qa.getAttribute('data-id');
        if (act === 'open-batch') {
          const allBatchIds = (() => {
            const matchedMeta = (state.batchesMeta || []).find(b => Array.isArray(b.jobIds) && b.jobIds.includes(id));
            if (matchedMeta && matchedMeta.jobIds.length > 1) return matchedMeta.jobIds;
            const qIds = (state.queue || []).map(q => q.id).filter(Boolean);
            return qIds.length > 1 ? qIds : [id];
          })();
          if (window.AndroidBridge && window.AndroidBridge.setAppState) {
            window.AndroidBridge.setAppState('cv_active_job_id', id || allBatchIds[0] || '');
            window.AndroidBridge.setAppState('cv_batch_job_ids', JSON.stringify(allBatchIds));
          }
          try {
            localStorage.setItem('cv_active_job_id', id || allBatchIds[0] || '');
            localStorage.setItem('cv_batch_job_ids', JSON.stringify(allBatchIds));
          } catch (_) {}
          const destPage = allBatchIds.length > 1 ? 'conversion_vault_p4_convert_batch.html' : 'conversion_vault_p4a_convert_single.html';
          if (window.VaultBridge) window.VaultBridge.navigateTo(destPage);
          else window.location.href = destPage;
          return;
        }
        if (act === 'open') {
          const matchedMeta = (state.batchesMeta || []).find(b => Array.isArray(b.jobIds) && b.jobIds.length > 1 && b.jobIds.includes(id));
          const isInActiveMultiQueue = (state.queue || []).length > 1 && (state.queue || []).some(q => q.id === id);
          const batchIds = matchedMeta ? matchedMeta.jobIds : (isInActiveMultiQueue ? (state.queue || []).map(q => q.id).filter(Boolean) : []);
          if (window.AndroidBridge && window.AndroidBridge.setAppState) {
            window.AndroidBridge.setAppState('cv_active_job_id', id);
            window.AndroidBridge.setAppState('cv_batch_job_ids', JSON.stringify(batchIds));
          }
          try {
            localStorage.setItem('cv_active_job_id', id);
            localStorage.setItem('cv_batch_job_ids', JSON.stringify(batchIds));
          } catch (_) {}
          const destPage = batchIds.length > 1 ? 'conversion_vault_p4_convert_batch.html' : 'conversion_vault_p4a_convert_single.html';
          if (window.VaultBridge) window.VaultBridge.navigateTo(destPage);
          else window.location.href = destPage;
          return;
        }
        if (act === 'folder') {
          const qItem = state.queue.find(x => x.id === id) || state.history.find(x => x.id === id);
          const destPath = (qItem && qItem.dest) ? String(qItem.dest) : '';
          const dir = destPath.lastIndexOf('/') > 0 ? destPath.substring(0, destPath.lastIndexOf('/')) : '';
          if (window.AndroidBridge && typeof window.AndroidBridge.openFolder === 'function') {
            window.AndroidBridge.openFolder(dir);
          } else {
            showToast('Opening File Manager...');
          }
          return;
        }
        if (act === 'toggle-bundle') {
          state.bundleOpen = !state.bundleOpen;
          render();
          return;
        }
        if (act === 'pause-batch' && window.AndroidBridge && window.AndroidBridge.pauseQueue) {
          window.AndroidBridge.pauseQueue();
          showToast('Batch paused ❚❚');
          setTimeout(loadJobsFromNative, 250);
          return;
        }
        if (act === 'resume-batch' && window.AndroidBridge && window.AndroidBridge.resumeQueue) {
          window.AndroidBridge.resumeQueue();
          showToast('Resuming batch ▶');
          setTimeout(loadJobsFromNative, 250);
          return;
        }
        if (act === 'cancel-batch' && window.AndroidBridge && window.AndroidBridge.cancelAllActiveJobs) {
          window.AndroidBridge.cancelAllActiveJobs();
          showToast('Cancelled batch queue');
          setTimeout(loadJobsFromNative, 250);
          return;
        }
        if (act === 'resume' && window.AndroidBridge && window.AndroidBridge.resumeJob) {
          window.AndroidBridge.resumeJob(id);
          showToast('Resumed job ▶');
          setTimeout(loadJobsFromNative, 250);
          return;
        }
        if (act === 'toggle-cancel-batch') {
          const bid = qa.getAttribute('data-bid');
          if (state.openBatchIds.has(bid)) state.openBatchIds.delete(bid);
          else state.openBatchIds.add(bid);
          render();
          return;
        }
        if (act === 'resume-cancelled-batch' && window.AndroidBridge && window.AndroidBridge.resumeBatchJobs) {
          const idsStr = qa.getAttribute('data-ids') || '[]';
          window.AndroidBridge.resumeBatchJobs(idsStr);
          showToast('Resumed cancelled batch ▶');
          state.view = 'queue';
          state.userPickedTab = true;
          setTimeout(() => {
            let parsedIds = [];
            try { parsedIds = JSON.parse(idsStr || '[]'); } catch (_) {}
            if (!Array.isArray(parsedIds)) parsedIds = [];
            try {
              if (window.AndroidBridge && window.AndroidBridge.setAppState) {
                if (parsedIds[0]) window.AndroidBridge.setAppState('cv_active_job_id', parsedIds[0]);
                window.AndroidBridge.setAppState('cv_batch_job_ids', JSON.stringify(parsedIds));
              }
              if (parsedIds[0]) localStorage.setItem('cv_active_job_id', parsedIds[0]);
              localStorage.setItem('cv_batch_job_ids', JSON.stringify(parsedIds));
            } catch (_) {}
            const destPage = parsedIds.length > 1 ? 'conversion_vault_p4_convert_batch.html' : 'conversion_vault_p4a_convert_single.html';
            if (window.VaultBridge) window.VaultBridge.navigateTo(destPage);
            else loadJobsFromNative();
          }, 200);
          return;
        }
        if (act === 'cancel' && window.AndroidBridge && window.AndroidBridge.cancelJob) {
          window.AndroidBridge.cancelJob(id);
          showToast('Cancelled job');
          setTimeout(loadJobsFromNative, 250);
        }
        return;
      }

      const ha = e.target.closest('[data-hact]');
      if (ha) {
        const act = ha.getAttribute('data-hact');
        const id = ha.getAttribute('data-id');
        const item = state.history.find(h => h.id === id);
        if (!item) return;
        if (act === 'toggle') {
          if (state.openIds.has(id)) state.openIds.delete(id); else state.openIds.add(id);
          item.open = state.openIds.has(id);
          render();
        } else if (act === 'open' && window.AndroidBridge && window.AndroidBridge.openFile) {
          window.AndroidBridge.openFile(item.dest);
        } else if (act === 'share' && window.AndroidBridge && window.AndroidBridge.shareFile) {
          window.AndroidBridge.shareFile(item.dest);
        } else if (act === 'folder' && window.AndroidBridge && window.AndroidBridge.openFolder) {
          const dir = item.dest.lastIndexOf('/') > 0 ? item.dest.substring(0, item.dest.lastIndexOf('/')) : '';
          window.AndroidBridge.openFolder(dir);
        } else if (act === 'delete' && window.AndroidBridge && window.AndroidBridge.deleteJob) {
          window.AndroidBridge.deleteJob(id, false);
          showToast('Log removed');
          loadJobsFromNative();
        } else if (act === 'delfile') {
          state.pendingConfirm = { type: 'delfile', id: id, title: item.title };
          document.getElementById('confirm-title').textContent = 'Delete Output File?';
          document.getElementById('confirm-desc').textContent = 'Permanently delete "' + item.title + '" from storage and remove this log?';
          document.getElementById('btn-confirm-yes').textContent = 'Yes, Delete File';
          document.getElementById('confirm-modal').classList.remove('hidden');
        }
        return;
      }
    });

    document.getElementById('btn-clear-hist').addEventListener('click', () => {
      state.pendingConfirm = { type: 'clear' };
      document.getElementById('confirm-title').textContent = 'Clear Conversion History?';
      document.getElementById('confirm-desc').textContent = 'This removes all finished logs from History. Your converted files on storage will not be deleted.';
      document.getElementById('btn-confirm-yes').textContent = 'Yes, Clear History';
      document.getElementById('confirm-modal').classList.remove('hidden');
    });
    document.getElementById('btn-confirm-cancel').addEventListener('click', () => {
      state.pendingConfirm = null;
      document.getElementById('confirm-modal').classList.add('hidden');
    });
    document.getElementById('btn-confirm-yes').addEventListener('click', () => {
      const p = state.pendingConfirm;
      state.pendingConfirm = null;
      document.getElementById('confirm-modal').classList.add('hidden');
      if (!p || !window.AndroidBridge) return;
      if (p.type === 'clear' && window.AndroidBridge.clearHistory) {
        window.AndroidBridge.clearHistory(false);
        showToast('History cleared');
      } else if (p.type === 'delfile' && window.AndroidBridge.deleteJob) {
        window.AndroidBridge.deleteJob(p.id, true);
        showToast('Deleted ' + p.title);
      } else if ((p.type === 'del-logs' || p.type === 'del-files') && p.ids) {
        const delFiles = (p.type === 'del-files');
        if (window.AndroidBridge.deleteJobsBatch) {
          window.AndroidBridge.deleteJobsBatch(JSON.stringify(p.ids), delFiles);
        } else if (window.AndroidBridge.deleteJob) {
          p.ids.forEach(id => { try { window.AndroidBridge.deleteJob(id, delFiles); } catch (_) {} });
        }
        state.selectedIds.clear();
        state.selectMode = false;
        showToast((delFiles ? 'Deleted ' : 'Removed ') + p.ids.length + ' item(s)');
      }
      loadJobsFromNative();
    });

    loadJobsFromNative();
  </script>
  <script src="vault-bridge.js"></script>
</body>
</html>
