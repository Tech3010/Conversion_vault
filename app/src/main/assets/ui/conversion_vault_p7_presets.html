<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Conversion Vault · Presets Hub</title>
  <style>
    :root {
      /* Red Bull Racing Dark Mode (shadcn/ui precision tokens) */
      --bg: #090d16;
      --surface: #0f1624;
      --card: #131c2e;
      --card-elev: #172236;
      --input: #0a0f1a;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --subtle: #64748b;
      --crimson: #db0a40;
      --crimson-soft: rgba(219, 10, 64, 0.14);
      --crimson-hover: #be0837;
      --gold: #fcd116;
      --gold-soft: rgba(252, 209, 22, 0.13);
      --gold-text: #fcd116;
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --radius: 12px;
      --radius-sm: 8px;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13.5px;
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-frame {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      padding-bottom: 78px;
    }
    @media (min-width: 600px) {
      .app-frame { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    }

    /* Top App Bar (Clean — No Theme Toggle) */
    .app-bar {
      position: sticky; top: 0; z-index: 30;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .page-title { font-size: 15.5px; font-weight: 800; line-height: 1.2; display: flex; align-items: center; gap: 7px; }
    .page-sub { font-size: 10.5px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
    .btn-new-preset {
      padding: 7px 11px; border-radius: 7px; border: 1px solid var(--crimson);
      background: var(--crimson); color: #ffffff; font-family: var(--mono);
      font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .btn-new-preset:hover { background: var(--crimson-hover); }

    .content { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }

    /* Search & Import Bar */
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-inp {
      flex: 1; padding: 8px 11px; border-radius: 8px;
      border: 1px solid var(--border-strong); background: var(--input); color: var(--text);
      font-size: 12.5px; font-family: var(--sans);
    }
    .search-inp:focus { outline: none; border-color: var(--crimson); }
    .btn-import {
      padding: 8px 11px; border-radius: 8px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--text); font-family: var(--mono);
      font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .btn-import:hover { border-color: var(--gold); color: var(--gold-text); }

    /* Category Filter Pills */
    .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .f-chip {
      padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--muted); font-family: var(--mono);
      font-size: 10.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .f-chip.active { background: var(--crimson-soft); border-color: rgba(219, 10, 64, 0.55); color: var(--crimson); }

    /* Template Cards (Alight Motion Preset Hub Style) */
    .tpl-list { display: flex; flex-direction: column; gap: 11px; }
    .tpl-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px; display: flex; flex-direction: column; gap: 10px;
      transition: border-color 0.15s ease;
    }
    .tpl-card { contain: layout paint style; content-visibility: auto; contain-intrinsic-size: auto 235px; }
    .tpl-card.is-saved { border-color: rgba(252, 209, 22, 0.45); border-left: 3px solid var(--gold); }
    .tpl-card.is-builtin { border-left: 3px solid var(--crimson); }

    .tpl-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .tpl-badges { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
    .cat-pill {
      font-family: var(--mono); font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
    }
    .cp-video { background: var(--crimson-soft); color: var(--crimson); }
    .cp-audio { background: var(--emerald-soft); color: var(--emerald); }
    .cp-image { background: var(--gold-soft); color: var(--gold-text); }
    .orig-pill {
      font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; background: var(--card-elev); border: 1px solid var(--border-strong); color: var(--muted);
    }
    .orig-pill.saved { color: var(--gold-text); border-color: rgba(252, 209, 22, 0.4); }

    .tpl-name { font-size: 14px; font-weight: 800; color: var(--text); }
    .tpl-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tpl-specs {
      font-family: var(--mono); font-size: 10.5px; color: var(--text);
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 9px;
    }

    .mini-bars-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; }
    .mbar-col { display: flex; flex-direction: column; gap: 3px; }
    .mbar-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; white-space: nowrap; font-family: var(--mono); font-size: 10px; color: var(--muted); }
    .mbar-track { height: 5px; background: var(--input); border-radius: 999px; overflow: hidden; }
    .mbar-fill { height: 100%; border-radius: 999px; }

    .tpl-actions { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
    .btn-use {
      flex: 1; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--crimson);
      background: var(--crimson); color: #ffffff; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    .btn-use:hover { background: var(--crimson-hover); }
    .btn-sec {
      padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border-strong);
      background: var(--card-elev); color: var(--text); font-family: var(--mono);
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .btn-sec:hover { border-color: var(--gold); color: var(--gold-text); }

    /* Modal for Creating / Editing a Template */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(5, 8, 15, 0.78);
      display: flex; justify-content: center; align-items: flex-end; padding: 10px;
    }
    @media (min-width: 600px) { .modal-backdrop { align-items: center; } }
    .modal-sheet {
      width: 100%; max-width: 520px; max-height: 88vh;
      background: var(--bg); border: 1px solid var(--border-strong); border-radius: 14px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .modal-head {
      padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-close {
      width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 16px; cursor: pointer;
    }
    .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; }
    .modal-foot {
      padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .field input, .field select {
      width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border-strong);
      background: var(--input); color: var(--text); font-size: 12px;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .telemetry-box {
      background: var(--card-elev); border: 1px solid var(--border-strong); border-radius: 8px;
      padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .scope-lbl {
      font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }
    .adv-sec-lbl {
      grid-column: 1 / -1;
      font-family: var(--mono); font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--gold-text); padding-bottom: 5px; margin-top: 6px;
      border-bottom: 1px solid var(--border);
    }
    .adv-sec-lbl:first-child { margin-top: 0; }
    .meta-privacy-card {
      grid-column: 1 / -1;
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px dashed rgba(16, 185, 129, 0.55);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.09) 0%, rgba(15, 23, 42, 0.35) 100%);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .meta-privacy-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--emerald);
    }
    .meta-privacy-pill {
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.16);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .field.full { grid-column: 1 / -1; }
    .field label { display: flex; justify-content: space-between; }
    .field-val-pill { color: var(--gold-text); }
    input[type="range"] { width: 100%; accent-color: var(--gold); cursor: pointer; }

    /* Bottom Navigation Bar (4 Roots: Home · Queue & History · Presets · Settings) */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 540px; height: 66px;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 6px 4px; gap: 4px;
      display: grid; grid-template-columns: repeat(5, 1fr); z-index: 40;
    }
    .nav-item {
      border: 1px solid transparent; border-radius: 11px;
      background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 4px 2px; font-size: 9.8px; font-weight: 700; cursor: pointer;
      -webkit-tap-highlight-color: transparent; outline: none;
    }
    .nav-item.active {
      color: var(--crimson);
      background: var(--crimson-soft);
      border-color: rgba(219, 10, 64, 0.50);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 10px rgba(219, 10, 64, 0.18);
    }

    .confirm-sheet {
      width: 100%; max-width: 380px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .confirm-title { font-size: 15px; font-weight: 800; color: var(--text); }
    .confirm-desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .btn-danger-solid {
      padding: 8px 14px; border-radius: 7px; border: 1px solid var(--crimson);
      background: var(--crimson); color: #ffffff; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-danger-solid:hover { background: var(--crimson-hover); }

    .i-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%;
      border: 1px solid rgba(252, 209, 22, 0.5);
      background: var(--gold-soft);
      color: var(--gold-text);
      font-family: var(--mono); font-size: 9.5px; font-weight: 800; line-height: 1;
      cursor: pointer; flex-shrink: 0;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .i-btn:hover { background: var(--gold); color: #090d16; transform: scale(1.1); }
    body.hide-hints .i-btn { display: none !important; }
    .btn-hint-toggle {
      padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-strong);
      background: var(--card); color: var(--gold-text); font-family: var(--mono);
      font-size: 10px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .btn-hint-toggle.is-off { color: var(--muted); }
    .mbar-col { min-width: 0; }
    .mini-bars-grid { width: 100%; }
    .mbar-right { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .lbl-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%; }
    .lbl-right { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .info-pop-backdrop {
      position: fixed; inset: 0; z-index: 110;
      background: rgba(5, 8, 15, 0.76);
      display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    .info-pop-card {
      width: 100%; max-width: 380px; background: var(--surface);
      border: 1px solid var(--gold); border-radius: 13px; padding: 15px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
      display: flex; flex-direction: column; gap: 10px;
    }
    .info-pop-title { font-size: 14px; font-weight: 800; color: var(--gold-text); display: flex; align-items: center; gap: 7px; }
    .info-pop-body { font-size: 12.5px; color: var(--text); line-height: 1.55; white-space: pre-line; }
    .info-pop-btn {
      align-self: flex-end; padding: 7px 14px; border-radius: 7px;
      border: 1px solid var(--crimson); background: var(--crimson);
      color: #ffffff; font-family: var(--mono); font-size: 11px; font-weight: 800; cursor: pointer;
    }

    .tools-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sort-sel {
      flex: 1; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--text); font-family: var(--mono); font-size: 11px; font-weight: 700;
    }
    .btn-sel-mode {
      padding: 6px 11px; border-radius: 7px; border: 1px solid var(--border-strong);
      background: var(--card-elev); color: var(--text); font-family: var(--mono); font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap;
    }
    .btn-sel-mode.active { border-color: var(--crimson); background: var(--crimson-soft); color: var(--crimson); }
    .sel-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 7px;
      background: var(--card-elev); border: 1px solid rgba(252,209,22,0.45); border-radius: 9px; padding: 8px 10px;
    }
    .sel-bar-left { display: flex; align-items: center; gap: 8px; }
    .sel-bar-acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .tpl-card.is-selected { border-color: var(--gold) !important; box-shadow: 0 0 0 1px rgba(252,209,22,0.35); }
    .tpl-sel-chk { width: 17px; height: 17px; accent-color: var(--gold); cursor: pointer; flex-shrink: 0; margin-right: 4px; }

    .hidden { display: none !important; }
    .toast {
      position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px;
      font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 120;
    }
    .toast.show { opacity: 1; }
  </style>
  <script>
    (function(){
      try {
        var t = (window.AndroidBridge && window.AndroidBridge.getAppState && window.AndroidBridge.getAppState('cv_theme')) || localStorage.getItem('cv_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
  <script src="vault-presets.js"></script>
</head>
<body>
  <div class="app-frame">
    <!-- Top App Bar -->
    <header class="app-bar">
      <div>
        <div class="page-title">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--crimson)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>Presets</span>
        </div>
        <div class="page-sub">TEMPLATES · BUILT-IN &amp; SAVED PRESET HUB</div>
      </div>
      <button type="button" id="btn-new-preset" class="btn-new-preset">+ New Preset</button>
    </header>

    <main class="content">
      <div class="search-row">
        <input type="text" id="inp-search" class="search-inp" placeholder="Search presets: Reels, 10-bit, Opus, WebP...">
      </div>

      <div class="filter-row" id="cat-filters">
        <button type="button" class="f-chip active" data-cat="all" id="chip-all">All (7)</button>
        <button type="button" class="f-chip" data-cat="video">Videos</button>
        <button type="button" class="f-chip" data-cat="audio">Audios</button>
        <button type="button" class="f-chip" data-cat="image">Images</button>
        <button type="button" class="f-chip" data-cat="saved">My Saved</button>
        <button type="button" class="f-chip" data-cat="deleted" id="chip-del">Deleted (0)</button>
      </div>

      <div class="tools-row" id="preset-tools-row">
        <select id="sel-preset-sort" class="sort-sel" aria-label="Sort Presets">
          <option value="default">Sort: Default</option>
          <option value="name_asc">Sort: Name (A → Z)</option>
          <option value="name_desc">Sort: Name (Z → A)</option>
          <option value="cat">Sort: Media Type</option>
          <option value="saved_first">Sort: Saved First</option>
          <option value="builtin_first">Sort: Built-in First</option>
        </select>
        <button type="button" id="btn-preset-select" class="btn-sel-mode">Select</button>
      </div>

      <div class="sel-bar hidden" id="preset-sel-bar">
        <div class="sel-bar-left">
          <button type="button" id="btn-preset-sel-all" class="btn-sec" style="padding:5px 9px; font-size:10px;">Select All</button>
          <span id="lbl-preset-sel-cnt" style="font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--gold-text);">0 selected</span>
        </div>
        <div class="sel-bar-acts">
          <button type="button" id="btn-preset-sel-export" class="btn-sec" style="padding:5px 9px; font-size:10px; border-color:var(--gold); color:var(--gold-text);">Export</button>
          <button type="button" id="btn-preset-sel-restore" class="btn-sec hidden" style="padding:5px 9px; font-size:10px; border-color:var(--emerald); color:var(--emerald);">Restore</button>
          <button type="button" id="btn-preset-sel-delete" class="btn-sec" style="padding:5px 9px; font-size:10px; border-color:rgba(219,10,64,0.55); color:#fda4af;">Delete</button>
        </div>
      </div>

      <div class="tpl-list" id="tpl-list"></div>
    </main>

    <!-- Bottom Navigation Bar (4 Roots) -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <button type="button" class="nav-item" data-nav="home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>
      <button type="button" class="nav-item" data-nav="queue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>Queue</span>
      </button>
      <button type="button" class="nav-item active" data-nav="presets">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>Presets</span>
      </button>
      <button type="button" class="nav-item" data-nav="workflows">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 6h6"/><path d="M6 9v3a6 6 0 0 0 6 6h3"/>
        </svg>
        <span>Workflows</span>
      </button>
      <button type="button" class="nav-item" data-nav="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Quick New / Edit Preset Modal -->
  <div class="modal-backdrop hidden" id="tpl-modal" role="dialog" aria-modal="true" aria-label="Create Preset Template">
    <div class="modal-sheet">
      <div class="modal-head">
        <div class="modal-title" id="m-title">Create New Preset</div>
        <div style="display:flex; align-items:center; gap:6px;"><button type="button" class="btn-hint-toggle" data-toggle-hints="1">ⓘ Hints: ON</button><button type="button" id="btn-m-close" class="modal-close">×</button></div>
      </div>
      <div class="modal-body">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; background:var(--card-elev); border:1px dashed var(--border-strong); border-radius:8px;">
          <div style="min-width:0;">
            <div style="font-size:12px; font-weight:700;">Have a .json Preset File?</div>
            <div style="font-family:var(--mono); font-size:10px; color:var(--muted);">Import from /ConversionVault/Presets/ or storage</div>
          </div>
          <button type="button" id="btn-import" class="btn-import">Import .json ↗</button>
          <input type="file" id="inp-import-json" class="hidden" accept=".json,application/json">
        </div>
        <div class="field"><label for="m-name">Preset Name</label><input type="text" id="m-name" placeholder="e.g. Night Car Reels 60fps"></div>
        <div class="grid-2">
          <div class="field"><label for="m-cat">Media Type</label>
            <select id="m-cat"><option value="video">Video</option><option value="audio">Audio</option><option value="image">Image</option></select>
          </div>
          <div class="field"><label for="m-desc">Short Note</label><input type="text" id="m-desc" placeholder="Optional description"></div>
        </div>

        <div class="telemetry-box">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <span class="scope-lbl" style="display:inline-flex; align-items:center; gap:5px;">Live Preset Status <button type="button" class="i-btn" data-info="Preset Status Bars" aria-label="Info about Status Bars">i</button></span>
            <span class="page-sub" id="m-live-tag" style="margin-top:0;"></span>
          </div>
          <div class="mini-bars-grid" id="m-status-bars"></div>
          <div id="m-compat-note"></div>
        </div>

        <div id="m-dynamic-fields" class="grid-2"></div>
      </div>
      <div class="modal-foot">
        <button type="button" id="btn-m-save" class="btn-use" style="flex:none; padding:8px 18px;">Save Template</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal (Never Direct-Delete) -->
  <div class="modal-backdrop hidden" id="confirm-modal" role="dialog" aria-modal="true" aria-label="Confirm Preset Deletion">
    <div class="confirm-sheet">
      <div class="confirm-title" id="confirm-title">Delete Preset?</div>
      <div class="confirm-desc" id="confirm-desc">This preset will be moved to Deleted Presets so you can restore it anytime.</div>
      <div class="confirm-actions">
        <button type="button" id="btn-confirm-cancel" class="btn-sec">Cancel</button>
        <button type="button" id="btn-confirm-yes" class="btn-danger-solid">Yes, Move to Deleted</button>
      </div>
    </div>
  </div>

  <!-- Bright Info Explanation Popover -->
  <div class="info-pop-backdrop hidden" id="info-pop-modal" role="dialog" aria-modal="true" aria-label="Setting Explanation">
    <div class="info-pop-card">
      <div class="info-pop-title" id="info-pop-title">ⓘ Info</div>
      <div class="info-pop-body" id="info-pop-body"></div>
      <button type="button" id="btn-info-pop-close" class="info-pop-btn">Got it</button>
    </div>
  </div>

  <div class="toast" id="toast">Ready</div>

  <script>
    const state = {
      filter: 'all',
      query: '',
      sort: 'default',
      selectMode: false,
      selectedIds: new Set(),
      deleted: [],
      pendingDelete: null,
      templates: []
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    function render() {
      document.getElementById('chip-all').textContent = 'All (' + state.templates.length + ')';
      document.getElementById('chip-del').textContent = 'Deleted (' + state.deleted.length + ')';
      document.querySelectorAll('.f-chip').forEach(c => c.classList.toggle('active', c.getAttribute('data-cat') === state.filter));
      const q = state.query.trim().toLowerCase();
      const isDelView = state.filter === 'deleted';
      const sourceArr = isDelView ? state.deleted : state.templates;
      const list = sourceArr.filter(t => {
        if (!isDelView) {
          if (state.filter === 'saved' && t.origin !== 'saved') return false;
          if (['video', 'audio', 'image'].includes(state.filter) && t.cat !== state.filter) return false;
        }
        if (q && !(t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.specs.toLowerCase().includes(q))) return false;
        return true;
      }).slice();

      if (state.sort === 'name_asc') {
        list.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' }));
      } else if (state.sort === 'name_desc') {
        list.sort((a, b) => String(b.name || '').localeCompare(String(a.name || ''), undefined, { sensitivity: 'base' }));
      } else if (state.sort === 'cat') {
        const ord = { video: 0, audio: 1, image: 2 };
        list.sort((a, b) => ((ord[a.cat] ?? 9) - (ord[b.cat] ?? 9)) || String(a.name || '').localeCompare(String(b.name || '')));
      } else if (state.sort === 'saved_first') {
        list.sort((a, b) => ((a.origin === 'saved' ? 0 : 1) - (b.origin === 'saved' ? 0 : 1)) || String(a.name || '').localeCompare(String(b.name || '')));
      } else if (state.sort === 'builtin_first') {
        list.sort((a, b) => ((a.origin === 'builtin' ? 0 : 1) - (b.origin === 'builtin' ? 0 : 1)) || String(a.name || '').localeCompare(String(b.name || '')));
      }

      const visibleIds = new Set(list.map(x => String(x.id)));
      Array.from(state.selectedIds).forEach(id => { if (!visibleIds.has(String(id))) state.selectedIds.delete(id); });
      const selBar = document.getElementById('preset-sel-bar');
      const selBtn = document.getElementById('btn-preset-select');
      const selAllBtn = document.getElementById('btn-preset-sel-all');
      const selCntEl = document.getElementById('lbl-preset-sel-cnt');
      const selExpBtn = document.getElementById('btn-preset-sel-export');
      const selResBtn = document.getElementById('btn-preset-sel-restore');
      const selDelBtn = document.getElementById('btn-preset-sel-delete');
      if (selBtn) {
        selBtn.classList.toggle('active', state.selectMode);
        selBtn.textContent = state.selectMode ? 'Done' : 'Select';
      }
      if (selBar) selBar.classList.toggle('hidden', !state.selectMode);
      if (selCntEl) selCntEl.textContent = state.selectedIds.size + ' selected';
      if (selAllBtn) selAllBtn.textContent = (list.length > 0 && state.selectedIds.size === list.length) ? 'Clear All' : 'Select All';
      if (selExpBtn) selExpBtn.classList.toggle('hidden', isDelView);
      if (selResBtn) selResBtn.classList.toggle('hidden', !isDelView);
      if (selDelBtn) selDelBtn.textContent = isDelView ? 'Delete Forever' : 'Delete';

      const wrap = document.getElementById('tpl-list');
      if (list.length === 0) {
        wrap.innerHTML = `<div style="padding:24px; text-align:center; color:var(--muted); border:1px dashed var(--border-strong); border-radius:12px;">${isDelView ? 'Deleted Presets folder is empty.' : 'No presets match your filter.'}</div>`;
        return;
      }

      const buildCardHtml = (t) => {
        const catCls = t.cat === 'video' ? 'cp-video' : (t.cat === 'audio' ? 'cp-audio' : 'cp-image');
        const catLbl = t.cat.toUpperCase();
        return `
          <article class="tpl-card ${t.origin === 'saved' ? 'is-saved' : 'is-builtin'}${state.selectMode && state.selectedIds.has(String(t.id)) ? ' is-selected' : ''}" data-card-id="${t.id}">
            <div class="tpl-top">
              <div style="display:flex; align-items:flex-start; gap:6px; min-width:0; width:100%;">
                ${state.selectMode ? `<input type="checkbox" class="tpl-sel-chk" data-sel-id="${t.id}" ${state.selectedIds.has(String(t.id)) ? 'checked' : ''} style="margin-top:2px;">` : ''}
                <div style="min-width:0; flex:1;">
                <div class="tpl-badges">
                  <span class="cat-pill ${catCls}">${catLbl}</span>
                  <span class="orig-pill ${t.origin === 'saved' ? 'saved' : ''}">${t.origin === 'saved' ? 'SAVED' : 'BUILT-IN'}</span>
                </div>
                <div class="tpl-name">${t.name}</div>
                <div class="tpl-desc">${t.desc}</div>
                </div>
              </div>
            </div>
            <div class="tpl-specs">${t.specs}</div>
            ${window.VaultPresets && window.VaultPresets.getCodecCompatNote ? window.VaultPresets.renderCompatNoteHtml(window.VaultPresets.getCodecCompatNote({ cat: t.cat, cfg: t.cfg, specs: t.specs })) : ''}
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:-4px;"><span class="scope-lbl">Preset Status</span><button type="button" class="i-btn" data-info="Preset Status Bars" aria-label="Info about Status Bars">i</button></div>
            <div class="mini-bars-grid">
              <div class="mbar-col"><div class="mbar-head"><span>Quality Preserved</span><span>${t.qual}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${t.qual}%; background:var(--emerald);"></div></div></div>
              <div class="mbar-col"><div class="mbar-head"><span>Size Compressed</span><span>${t.comp}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${t.comp}%; background:var(--gold);"></div></div></div>
              <div class="mbar-col"><div class="mbar-head"><span>Processing Speed</span><span>${t.speed}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${t.speed}%; background:var(--crimson);"></div></div></div>
              <div class="mbar-col"><div class="mbar-head"><span>Compatibility</span><span>${t.compat || 90}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${t.compat || 90}%; background:#38bdf8;"></div></div></div>
              <div class="mbar-col"><div class="mbar-head"><span>Raw Fidelity</span><span>${t.edit || 75}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${t.edit || 75}%; background:#a855f7;"></div></div></div>
              <div class="mbar-col"><div class="mbar-head"><span>Battery Efficiency</span><span>${t.batt || 80}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${t.batt || 80}%; background:#22c55e;"></div></div></div>
            </div>
            <div class="tpl-actions">
              ${isDelView ? `
                <button type="button" class="btn-use" data-act="restore" data-id="${t.id}">Restore Preset ↺</button>
                <button type="button" class="btn-sec" style="border-color:rgba(219,10,64,0.5); color:var(--crimson);" data-act="perm-del" data-id="${t.id}">Delete Forever</button>
              ` : `
                <button type="button" class="btn-use" data-act="use" data-id="${t.id}">Use Preset ↗</button>
                <button type="button" class="btn-sec" data-act="rename" data-id="${t.id}">Rename</button>
                <button type="button" class="btn-sec" data-act="dup" data-id="${t.id}">Duplicate</button>
                <button type="button" class="btn-sec" data-act="share" data-id="${t.id}">Export JSON</button>
                <button type="button" class="btn-sec" style="border-color:rgba(219,10,64,0.45); color:var(--crimson);" data-act="del" data-id="${t.id}">Delete</button>
              `}
            </div>
          </article>
        `;
      };
      if (list.length <= 6) {
        wrap.innerHTML = list.map(buildCardHtml).join('');
      } else {
        const renderToken = (window.__cvP7RenderTok = (window.__cvP7RenderTok || 0) + 1);
        wrap.innerHTML = list.slice(0, 6).map(buildCardHtml).join('');
        requestAnimationFrame(() => {
          if (window.__cvP7RenderTok !== renderToken) return;
          wrap.insertAdjacentHTML('beforeend', list.slice(6).map(buildCardHtml).join(''));
        });
      }
    }

    document.getElementById('inp-search').addEventListener('input', function() {
      state.query = this.value;
      render();
    });

    document.getElementById('btn-import').addEventListener('click', () => document.getElementById('inp-import-json').click());
    document.getElementById('inp-import-json').addEventListener('change', function() {
      if (this.files && this.files.length > 0) {
        const fname = this.files[0].name.replace(/\.json$/i, '');
        state.templates.unshift({
          id: Date.now(), cat: 'video', origin: 'saved', name: fname,
          desc: 'Imported from ' + this.files[0].name,
          specs: '.mp4 · libx264 · Imported .json preset',
          qual: 88, comp: 66, speed: 60
        });
        document.getElementById('tpl-modal').classList.add('hidden');
        state.filter = 'all';
        render();
        showToast('Imported "' + fname + '" into Presets Hub');
      }
      this.value = '';
    });
    const DEF_CFG = {
      video: {
        container: 'mp4', codec: 'libx264', rcMode: 'crf_cap', crf: 18, maxrate: 12,
        preset: 'slower', gop: 'auto', bframes: 2, fps: '60', scale: 'original', orient: 'keep', pixfmt: 'yuv420p',
        audioCodec: 'aac', audioBr: '192k', audioAr: '48000', audioCh: 'stereo', audioNorm: 'none',
        subMode: 'strip', meta: 'deep', tune: 'none', vfilter: 'none', speed: '1.0', trimStart: '00:00:00', trimEnd: 'End', audioGain: '0dB', faststart: 'faststart'
      },
      audio: {
        fmt: 'opus', br: '192k', ar: '48000', bitDepth: 'auto', channels: 'stereo', af: 'none', meta: 'wipe'
      },
      image: {
        fmt: 'webp', qual: 85, scale: 'original', orient: 'auto', colorSpace: 'srgb_444', meta: 'wipe'
      }
    };

    let editingId = null;
    const modalCfg = {
      cat: 'video',
      draft: Object.assign({}, DEF_CFG.video)
    };

    function computeModalBars(cat, cfg) {
      if (cat === 'video') {
        if (cfg.codec === 'copy') return { qual: 100, comp: 50, speed: 99, compat: 95, edit: 72, batt: 99 };
        const qual = cfg.rcMode === 'lossless' ? 100 : Math.max(35, Math.min(99, Math.round(100 - (cfg.crf - 14) * 2.5 + (cfg.pixfmt === 'yuv420p10le' ? 3 : 0))));
        const codecComp = cfg.codec === 'libsvtav1' ? 20 : (cfg.codec === 'libx265' ? 14 : (cfg.codec === 'libvpx-vp9' ? 10 : 0));
        const comp = Math.max(15, Math.min(98, Math.round(52 + (cfg.crf - 18) * 2.3 + codecComp + (cfg.gop === '1' ? -30 : 0))));
        const preMap = { ultrafast: 95, fast: 78, medium: 60, slow: 44, slower: 30, veryslow: 16 };
        const speed = Math.max(10, Math.min(98, (preMap[cfg.preset] || 50) - (cfg.codec === 'libx265' ? 14 : (cfg.codec === 'libsvtav1' ? 20 : 0))));
        let compat = cfg.codec === 'libx264' ? 98 : (cfg.codec === 'libx265' ? 74 : (cfg.codec === 'libvpx-vp9' ? 78 : 48));
        if (cfg.pixfmt === 'yuv420p10le') compat -= 18;
        compat = Math.max(25, Math.min(99, compat));
        const edit = cfg.gop === '1' ? 99 : (cfg.gop === '15' ? 84 : (cfg.codec === 'libx264' ? 68 : 46));
        const batt = Math.max(18, Math.min(98, Math.round(speed * 0.85 + 12)));
        return { qual, comp, speed, compat, edit, batt };
      }
      if (cat === 'audio') {
        const isLossless = cfg.fmt === 'flac' || cfg.fmt === 'wav';
        const brNum = parseInt(cfg.br, 10) || 192;
        const qual = isLossless ? 100 : Math.min(97, Math.round(62 + (brNum / 320) * 35 + (cfg.fmt === 'opus' ? 6 : 0)));
        const comp = cfg.fmt === 'wav' ? 10 : (cfg.fmt === 'flac' ? 52 : Math.max(55, Math.min(96, Math.round(100 - (brNum / 320) * 35))));
        const compat = cfg.fmt === 'mp3' || cfg.fmt === 'm4a' || cfg.fmt === 'wav' ? 99 : (cfg.fmt === 'flac' ? 92 : 86);
        const edit = isLossless ? 99 : 82;
        return { qual, comp, speed: 94, compat, edit, batt: 96 };
      }
      const qual = cfg.fmt === 'png' ? 100 : Math.max(30, Math.min(99, cfg.qual));
      const comp = cfg.fmt === 'png' ? 30 : Math.max(40, Math.min(98, Math.round(108 - cfg.qual * 0.4 + (cfg.fmt === 'avif' ? 14 : (cfg.fmt === 'webp' ? 8 : 0)))));
      const speed = cfg.fmt === 'avif' ? 42 : 92;
      const compat = cfg.fmt === 'jpg' || cfg.fmt === 'png' ? 99 : (cfg.fmt === 'webp' ? 94 : 72);
      const edit = cfg.fmt === 'png' ? 99 : 88;
      const batt = cfg.fmt === 'avif' ? 68 : 95;
      return { qual, comp, speed, compat, edit, batt };
    }

    function buildAutoSpec(cat, cfg) {
      if (cat === 'video') {
        if (cfg.codec === 'copy') return `.${cfg.container} · Stream Copy · Aud:${cfg.audioCodec} · Sub:${cfg.subMode}`;
        const fpsStr = cfg.fps === 'original' ? 'SrcFPS' : cfg.fps + 'fps';
        const audStr = cfg.audioCodec === 'none' ? 'Muted' : cfg.audioCodec.replace('lib', '').toUpperCase() + ' ' + cfg.audioBr;
        const oriStr = cfg.orient !== 'keep' ? ' · Rot:' + cfg.orient : '';
        return `.${cfg.container} · ${cfg.codec.replace('lib', '')} · ${fpsStr} · CRF ${cfg.crf} · ${audStr}${oriStr} · Sub:${cfg.subMode}`;
      }
      if (cat === 'audio') {
        const loss = ['flac', 'wav'].includes(cfg.fmt);
        return `.${cfg.fmt} · ${loss ? ('Lossless ' + cfg.bitDepth) : cfg.br} · ${cfg.ar === 'keep' ? 'SrcHz' : cfg.ar + 'Hz'} · ${cfg.channels}`;
      }
      const ori = cfg.orient !== 'keep' ? ' · ' + cfg.orient : '';
      return `.${cfg.fmt} · ${cfg.fmt === 'png' ? 'Lossless' : 'Q' + cfg.qual}${cfg.scale !== 'original' ? ' · ' + cfg.scale + 'px' : ''}${ori}`;
    }

    function renderModalFields() {
      const cat = modalCfg.cat;
      const draft = modalCfg.draft;
      const bars = computeModalBars(cat, draft);

      document.getElementById('m-live-tag').textContent = buildAutoSpec(cat, draft);
      const mCompatEl = document.getElementById('m-compat-note');
      if (mCompatEl && window.VaultPresets && window.VaultPresets.getCodecCompatNote) {
        mCompatEl.innerHTML = window.VaultPresets.renderCompatNoteHtml(window.VaultPresets.getCodecCompatNote({ cat: modalCfg.cat, cfg: modalCfg.draft }));
      }
      document.getElementById('m-status-bars').innerHTML = `
        <div class="mbar-col"><div class="mbar-head"><span>Quality Preserved</span><span>${bars.qual}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${bars.qual}%; background:var(--emerald);"></div></div></div>
        <div class="mbar-col"><div class="mbar-head"><span>Size Compressed</span><span>${bars.comp}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${bars.comp}%; background:var(--gold);"></div></div></div>
        <div class="mbar-col"><div class="mbar-head"><span>Processing Speed</span><span>${bars.speed}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${bars.speed}%; background:var(--crimson);"></div></div></div>
        <div class="mbar-col"><div class="mbar-head"><span>Compatibility</span><span>${bars.compat}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${bars.compat}%; background:#38bdf8;"></div></div></div>
        <div class="mbar-col"><div class="mbar-head"><span>Raw Fidelity</span><span>${bars.edit}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${bars.edit}%; background:#a855f7;"></div></div></div>
        <div class="mbar-col"><div class="mbar-head"><span>Battery Efficiency</span><span>${bars.batt}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${bars.batt}%; background:#22c55e;"></div></div></div>
      `;

      const wrap = document.getElementById('m-dynamic-fields');
      if (cat === 'video') {
        const audioDisabled = draft.audioCodec === 'none';
        wrap.innerHTML = `
          <div class="adv-sec-lbl">Video Stream, FPS &amp; Orientation</div>
          <div class="field"><label class="lbl-row"><span>Container</span><button type="button" class="i-btn" data-info="Container" aria-label="Info about Container">i</button></label>
            <select data-mc="container">
              <option value="mp4" ${draft.container === 'mp4' ? 'selected' : ''}>.mp4 (Universal)</option>
              <option value="mkv" ${draft.container === 'mkv' ? 'selected' : ''}>.mkv (Matroska)</option>
              <option value="webm" ${draft.container === 'webm' ? 'selected' : ''}>.webm (WebM)</option>
              <option value="mov" ${draft.container === 'mov' ? 'selected' : ''}>.mov (QuickTime)</option>
              <option value="ts" ${draft.container === 'ts' ? 'selected' : ''}>.ts (Transport)</option>
            </select>
          </div>
          <div class="field"><label class="lbl-row"><span>Video Codec (-c:v)</span><button type="button" class="i-btn" data-info="Video Codec (-c:v)" aria-label="Info about Video Codec (-c:v)">i</button></label>
            <select data-mc="codec">
              <option value="libx264" ${draft.codec === 'libx264' ? 'selected' : ''}>libx264 (H.264)</option>
              <option value="libx265" ${draft.codec === 'libx265' ? 'selected' : ''}>libx265 (HEVC)</option>
              <option value="libsvtav1" ${draft.codec === 'libsvtav1' ? 'selected' : ''}>libsvtav1 (AV1)</option>
              <option value="libvpx-vp9" ${draft.codec === 'libvpx-vp9' ? 'selected' : ''}>libvpx-vp9 (VP9)</option>
              <option value="copy" ${draft.codec === 'copy' ? 'selected' : ''}>copy (Zero Loss)</option>

    function getSavedDefaultMetaPolicy(forCat) {
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.getSettings === 'function') {
          const s = JSON.parse(window.AndroidBridge.getSettings() || '{}');
          const raw = String(s.defaultMetadataPolicy || 'wipe').toLowerCase();
          if (raw === 'forensic' || raw === 'deep') return 'deep';
          if (raw === 'keep') return 'keep';
          if (raw === 'gps') return (forCat === 'audio' ? 'wipe' : 'gps');
          return 'wipe';
        }
      } catch (_) {}
      return 'wipe';
    }

    document.getElementById('btn-new-preset').addEventListener('click', () => {
      editingId = null;
      document.getElementById('m-title').textContent = 'Create New Preset';
      document.getElementById('m-name').value = '';
      document.getElementById('m-desc').value = '';
      modalCfg.cat = 'video';
      document.getElementById('m-cat').value = 'video';
      modalCfg.draft = Object.assign({}, DEF_CFG.video, { meta: getSavedDefaultMetaPolicy('video') });
      renderModalFields();
      document.getElementById('tpl-modal').classList.remove('hidden');
    });
    document.getElementById('m-cat').addEventListener('change', function() {
      modalCfg.cat = this.value;
      modalCfg.draft = Object.assign({}, DEF_CFG[modalCfg.cat], { meta: getSavedDefaultMetaPolicy(modalCfg.cat) });
      renderModalFields();
    });
    document.getElementById('m-dynamic-fields').addEventListener('input', (e) => {
      const t = e.target;
      if (t.matches('[data-mc]')) {
        const k = t.getAttribute('data-mc');
        const val = t.type === 'range' ? parseInt(t.value, 10) : t.value;
        modalCfg.draft[k] = val;
        if (t.type === 'range') {
          const fld = t.closest('.field');
          const fv = fld ? fld.querySelector('.field-val') : null;
          if (fv) {
            if (k === 'crf') fv.textContent = 'CRF ' + val;
            else if (k === 'maxrate') fv.textContent = val + ' Mbps';
            else if (k === 'qual') fv.textContent = val + '%';
            else if (k === 'brightness') fv.textContent = (val > 0 ? '+' : '') + val + '%';
            else fv.textContent = String(val);
          }
          const barsEl = document.getElementById('m-status-bars');
          if (barsEl && typeof computeModalBars === 'function' && typeof renderBarsHTML === 'function') {
            barsEl.innerHTML = renderBarsHTML(computeModalBars(modalCfg.cat, modalCfg.draft));
          }
          const specEl = document.getElementById('m-spec-preview');
          if (specEl && typeof buildAutoSpec === 'function') specEl.textContent = buildAutoSpec(modalCfg.cat, modalCfg.draft);
          return;
        }
        renderModalFields();
      }
    });
    document.getElementById('m-dynamic-fields').addEventListener('change', (e) => {
      const t = e.target;
      if (t && t.type === 'range' && t.matches('[data-mc]')) {
        renderModalFields();
      }
    });
    document.getElementById('btn-m-close').addEventListener('click', () => document.getElementById('tpl-modal').classList.add('hidden'));
    document.getElementById('btn-m-save').addEventListener('click', () => {
      const nm = document.getElementById('m-name').value.trim() || ('Custom Preset #' + (state.templates.length + 1));
      const cat = modalCfg.cat;
      const specs = buildAutoSpec(cat, modalCfg.draft);
      const bars = computeModalBars(cat, modalCfg.draft);
      const desc = document.getElementById('m-desc').value.trim() || 'User-created preset template.';
      const tplObj = { id: Date.now(), cat, origin: 'saved', name: nm, desc, specs, qual: bars.qual, comp: bars.comp, speed: bars.speed, compat: bars.compat, edit: bars.edit, batt: bars.batt, cfg: Object.assign({}, modalCfg.draft, { presetName: nm }) };
      state.templates.unshift(tplObj);
      if (window.AndroidBridge && typeof window.AndroidBridge.savePreset === 'function') {
        try {
          const saveRes = JSON.parse(window.AndroidBridge.savePreset(JSON.stringify({
            name: nm,
            category: cat === 'audio' ? 'Audio' : (cat === 'image' ? 'Image' : 'Video'),
            codec: (modalCfg.draft && (modalCfg.draft.codec || modalCfg.draft.fmt)) || 'libx264',
            container: (modalCfg.draft && (modalCfg.draft.container || modalCfg.draft.fmt)) || 'mp4',
            crfOrBitrate: String((modalCfg.draft && (modalCfg.draft.crf || modalCfg.draft.br || modalCfg.draft.qual)) || '18'),
            extraFlags: JSON.stringify({ desc, specs, bars, cfg: tplObj.cfg })
          })) || '{}');
          if (saveRes && saveRes.id) tplObj.roomId = saveRes.id;
        } catch (_) {}
      }
      document.getElementById('tpl-modal').classList.add('hidden');
      state.filter = 'all';
      render();
      showToast('Saved "' + nm + '" (synced to Studio & Batch)');
    });

    document.addEventListener('click', (e) => {
      const fc = e.target.closest('.f-chip');
      if (fc) { state.filter = fc.getAttribute('data-cat'); if (state.filter === 'deleted' && typeof syncHubFromVaultPresets === 'function') { syncHubFromVaultPresets(); return; } render(); return; }

      const actEl = e.target.closest('[data-act]');
      if (actEl) {
        const act = actEl.getAttribute('data-act');
        const rawId = String(actEl.getAttribute('data-id') || '');
        const id = parseInt(rawId, 10);
        const t = state.templates.find(x => String(x.id) === rawId || x.id === id) || state.deleted.find(x => String(x.id) === rawId || x.id === id);
        if (!t) return;
        if (act === 'use') {
          if (window.VaultPresets) {
            window.VaultPresets.setPendingPreset({
              source: 'presets_hub',
              name: t.name,
              cat: t.cat,
              category: t.cat === 'audio' ? 'Audio' : (t.cat === 'image' ? 'Image' : 'Video'),
              specs: t.specs || '',
              cfg: t.cfg || null
            });
          }
          window.location.href = 'conversion_vault_p2_select.html?mode=preset';
          return;
        }
        else if (act === 'rename') {
          e.preventDefault(); e.stopPropagation();
          openRenamePresetModal(t);
          return;
        }
        else if (act === 'dup') {
          const dupName = t.name + ' (Copy)';
          const dupObj = Object.assign({}, t, { id: Date.now(), roomId: null, origin: 'saved', name: dupName });
          state.templates.unshift(dupObj);
          if (window.AndroidBridge && typeof window.AndroidBridge.savePreset === 'function') {
            try {
              const dupRes = JSON.parse(window.AndroidBridge.savePreset(JSON.stringify({
                name: dupName,
                category: t.cat === 'audio' ? 'Audio' : (t.cat === 'image' ? 'Image' : 'Video'),
                codec: (t.cfg && (t.cfg.codec || t.cfg.fmt)) || 'libx264',
                container: (t.cfg && (t.cfg.container || t.cfg.fmt)) || (t.cat === 'audio' ? 'opus' : (t.cat === 'image' ? 'webp' : 'mp4')),
                crfOrBitrate: String((t.cfg && (t.cfg.crf || t.cfg.br || t.cfg.qual)) || '18'),
                extraFlags: JSON.stringify({ desc: t.desc, specs: t.specs, bars: { qual: t.qual, comp: t.comp, speed: t.speed, compat: t.compat, edit: t.edit, batt: t.batt }, cfg: t.cfg || null })
              })) || '{}');
              if (dupRes && dupRes.id) dupObj.roomId = dupRes.id;
            } catch (_) {}
          }
          render();
          showToast('Duplicated as editable Saved Preset');
        } else if (act === 'share') {
          showToast('Saved to /ConversionVault/Presets/' + t.name.replace(/\s+/g, '_') + '.json');
        } else if (act === 'del') {
          state.pendingDelete = { mode: 'soft', id: t.id, name: t.name };
          document.getElementById('confirm-title').textContent = 'Move Preset to Deleted?';
          document.getElementById('confirm-desc').textContent =
            'Move "' + t.name + '" (' + (t.origin === 'saved' ? 'Saved' : 'Built-In') + ') to Deleted Presets? You can restore it anytime.';
          document.getElementById('btn-confirm-yes').textContent = 'Yes, Move to Deleted';
          document.getElementById('confirm-modal').classList.remove('hidden');
        } else if (act === 'restore') {
          state.deleted = state.deleted.filter(x => x.id !== id);
          state.templates.unshift(t);
          if (t.roomId && window.AndroidBridge && typeof window.AndroidBridge.restorePreset === 'function') {
            try { window.AndroidBridge.restorePreset(String(t.roomId)); } catch (_) {}
          }
          if (t.origin === 'builtin') {
            writeBuiltinStateList('cv_deleted_builtins', readBuiltinStateList('cv_deleted_builtins').filter(n => n !== t.name));
            writeBuiltinStateList('cv_perm_deleted_builtins', readBuiltinStateList('cv_perm_deleted_builtins').filter(n => n !== t.name));
          }
          render();
          showToast('Restored "' + t.name + '"');
        } else if (act === 'perm-del') {
          state.pendingDelete = { mode: 'perm', id: t.id, name: t.name };
          document.getElementById('confirm-title').textContent = 'Delete Preset Permanently?';
          document.getElementById('confirm-desc').textContent =
            'Permanently erase "' + t.name + '"? This cannot be undone.';
          document.getElementById('btn-confirm-yes').textContent = 'Yes, Delete Forever';
          document.getElementById('confirm-modal').classList.remove('hidden');
        }
        return;
      }

      const nav = e.target.closest('[data-nav]');
      if (nav) {
        const target = nav.getAttribute('data-nav');
        if (target !== 'presets') showToast('Navigating to ' + target.charAt(0).toUpperCase() + target.slice(1) + ' →');
      }
    });

    document.getElementById('btn-confirm-cancel').addEventListener('click', () => {
      state.pendingDelete = null;
      document.getElementById('confirm-modal').classList.add('hidden');
    });
    function readBuiltinStateList(key) {
      try {
        const raw = (window.AndroidBridge && typeof window.AndroidBridge.getAppState === 'function')
          ? window.AndroidBridge.getAppState(key)
          : localStorage.getItem(key);
        const arr = JSON.parse(raw || '[]');
        return Array.isArray(arr) ? arr : [];
      } catch (_) { return []; }
    }
    function writeBuiltinStateList(key, arr) {
      const uniq = Array.from(new Set(arr || []));
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.setAppState === 'function') {
          window.AndroidBridge.setAppState(key, JSON.stringify(uniq));
        } else {
          localStorage.setItem(key, JSON.stringify(uniq));
        }
      } catch (_) {}
    }

    document.getElementById('sel-preset-sort').addEventListener('change', function() {
      state.sort = this.value || 'default';
      render();
    });
    document.getElementById('btn-preset-select').addEventListener('click', () => {
      state.selectMode = !state.selectMode;
      if (!state.selectMode) state.selectedIds.clear();
      render();
    });
    document.getElementById('btn-preset-sel-all').addEventListener('click', () => {
      const isDelView = state.filter === 'deleted';
      const q = state.query.trim().toLowerCase();
      const sourceArr = isDelView ? state.deleted : state.templates;
      const visible = sourceArr.filter(t => {
        if (!isDelView) {
          if (state.filter === 'saved' && t.origin !== 'saved') return false;
          if (['video', 'audio', 'image'].includes(state.filter) && t.cat !== state.filter) return false;
        }
        if (q && !(t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.specs.toLowerCase().includes(q))) return false;
        return true;
      });
      if (visible.length > 0 && state.selectedIds.size === visible.length) {
        state.selectedIds.clear();
      } else {
        visible.forEach(t => state.selectedIds.add(String(t.id)));
      }
      render();
    });
    document.getElementById('btn-preset-sel-export').addEventListener('click', () => {
      const picked = state.templates.filter(t => state.selectedIds.has(String(t.id)));
      if (!picked.length) { showToast('Select at least 1 preset to export'); return; }
      const roomIds = picked.map(t => t.roomId).filter(Boolean);
      if (window.VaultPresets && roomIds.length) {
        const res = window.VaultPresets.exportSelected(roomIds);
        showToast(res && res.ok ? ('Exported ' + (res.count || roomIds.length) + ' preset(s) ✓') : ('Export failed: ' + ((res && res.error) || 'Error')));
      } else {
        showToast('Exported ' + picked.length + ' preset(s) ✓');
      }
    });
    document.getElementById('btn-preset-sel-restore').addEventListener('click', () => {
      const picked = state.deleted.filter(t => state.selectedIds.has(String(t.id)));
      if (!picked.length) { showToast('Select at least 1 preset to restore'); return; }
      picked.forEach(t => {
        if (t.roomId && window.VaultPresets) window.VaultPresets.restore(String(t.roomId));
        state.deleted = state.deleted.filter(x => x.id !== t.id);
        state.templates.unshift(t);
      });
      state.selectedIds.clear();
      render();
      showToast('Restored ' + picked.length + ' preset(s) ✓');
    });
    document.getElementById('btn-preset-sel-delete').addEventListener('click', () => {
      const isDelView = state.filter === 'deleted';
      const src = isDelView ? state.deleted : state.templates;
      const picked = src.filter(t => state.selectedIds.has(String(t.id)));
      if (!picked.length) { showToast('Select at least 1 preset first'); return; }
      state.pendingDelete = { mode: isDelView ? 'batch_perm' : 'batch_soft', ids: picked.map(t => t.id), count: picked.length };
      document.getElementById('confirm-title').textContent = isDelView ? ('Permanently Delete ' + picked.length + ' Presets?') : ('Delete ' + picked.length + ' Presets?');
      document.getElementById('confirm-desc').textContent = isDelView
        ? ('This will permanently erase ' + picked.length + ' selected preset(s). This cannot be undone.')
        : ('Move ' + picked.length + ' selected preset(s) to Deleted Presets? You can restore them anytime.');
      document.getElementById('btn-confirm-yes').textContent = isDelView ? 'Yes, Delete Forever' : 'Yes, Move to Deleted';
      document.getElementById('confirm-modal').classList.remove('hidden');
    });
    document.getElementById('tpl-list').addEventListener('change', (e) => {
      const chk = e.target.closest('.tpl-sel-chk');
      if (!chk) return;
      const sid = String(chk.getAttribute('data-sel-id') || '');
      if (chk.checked) state.selectedIds.add(sid);
      else state.selectedIds.delete(sid);
      render();
    });
    document.getElementById('tpl-list').addEventListener('click', (e) => {
      if (!state.selectMode) return;
      if (e.target.closest('button') || e.target.closest('input')) return;
      const card = e.target.closest('.tpl-card[data-card-id]');
      if (!card) return;
      const sid = String(card.getAttribute('data-card-id') || '');
      if (state.selectedIds.has(sid)) state.selectedIds.delete(sid);
      else state.selectedIds.add(sid);
      render();
    });

    document.getElementById('btn-confirm-yes').addEventListener('click', () => {
      const p = state.pendingDelete;
      if (!p) return;
      if (p.mode === 'batch_soft') {
        const idSet = new Set(p.ids);
        const moving = state.templates.filter(x => idSet.has(x.id));
        moving.forEach(item => {
          if (item.roomId && window.VaultPresets) window.VaultPresets.softDelete(String(item.roomId));
          state.deleted.unshift(item);
        });
        state.templates = state.templates.filter(x => !idSet.has(x.id));
        state.selectedIds.clear();
        showToast('Moved ' + moving.length + ' preset(s) to Deleted');
      } else if (p.mode === 'batch_perm') {
        const idSet = new Set(p.ids);
        const removing = state.deleted.filter(x => idSet.has(x.id));
        removing.forEach(item => {
          if (item.roomId && window.VaultPresets) window.VaultPresets.permanentDelete(String(item.roomId));
        });
        state.deleted = state.deleted.filter(x => !idSet.has(x.id));
        state.selectedIds.clear();
        showToast('Permanently deleted ' + removing.length + ' preset(s)');
      } else if (p.mode === 'soft') {
        const item = state.templates.find(x => x.id === p.id);
        if (item) {
          state.templates = state.templates.filter(x => x.id !== p.id);
          state.deleted.unshift(item);
          if (item.roomId && window.AndroidBridge && typeof window.AndroidBridge.softDeletePreset === 'function') {
            try { window.AndroidBridge.softDeletePreset(String(item.roomId)); } catch (_) {}
          }
          if (item.origin === 'builtin') {
            const delB = readBuiltinStateList('cv_deleted_builtins');
            delB.push(item.name);
            writeBuiltinStateList('cv_deleted_builtins', delB);
          }
          showToast('Moved "' + p.name + '" to Deleted Presets');
        }
      } else {
        const item = state.deleted.find(x => x.id === p.id);
        state.deleted = state.deleted.filter(x => x.id !== p.id);
        if (item && item.roomId && window.VaultPresets) {
          window.VaultPresets.permanentDelete(String(item.roomId));
        }
        showToast('Permanently deleted "' + p.name + '"');
      }
      state.pendingDelete = null;
      document.getElementById('confirm-modal').classList.add('hidden');
      render();
    });

    function syncHubFromVaultPresets() {
      if (!window.VaultPresets || !window.VaultPresets.hasBridge()) { render(); return; }
      try {
        const toHubItem = (p, idx) => {
          const bars = p.bars || (p.cfg ? computeModalBars(p.cat, p.cfg) : { qual: 88, comp: 68, speed: 64, compat: 95, edit: 72, batt: 74 });
          return {
            id: 1000 + idx,
            roomId: p.roomId,
            cat: p.cat,
            origin: p.origin,
            name: p.name,
            desc: p.desc,
            specs: p.specs,
            qual: bars.qual, comp: bars.comp, speed: bars.speed, compat: bars.compat, edit: bars.edit, batt: bars.batt,
            cfg: p.cfg || null
          };
        };
        state.templates = window.VaultPresets.listActive().map((p, idx) => toHubItem(p, idx));
        if (state.filter === 'deleted') {
          state.deleted = window.VaultPresets.listDeleted().map((p, idx) => toHubItem(p, 5000 + idx));
        } else {
          setTimeout(() => {
            try {
              state.deleted = window.VaultPresets.listDeleted().map((p, idx) => toHubItem(p, 5000 + idx));
              const tc = document.getElementById('cnt-del');
              if (tc) tc.textContent = String(state.deleted.length);
            } catch (_) {}
          }, 260);
        }
      } catch (_) {}
      render();
    }
    window.syncHubFromVaultPresets = syncHubFromVaultPresets;
    syncHubFromVaultPresets();
    (function wirePresetLongPress() {
      let lpTimer = null, lpFired = false, lpStartX = 0, lpStartY = 0;
      document.addEventListener('touchstart', (e) => {
        if (!e.touches || e.touches.length !== 1) return;
        const card = e.target && e.target.closest ? e.target.closest('.tpl-card') : null;
        if (!card || e.target.closest('button, input, select')) return;
        const idHolder = card.querySelector('[data-id]') || card.querySelector('[data-sel-preset]');
        if (!idHolder) return;
        const pid = parseInt(idHolder.getAttribute('data-id') || idHolder.getAttribute('data-sel-preset'), 10);
        if (isNaN(pid)) return;
        lpFired = false;
        lpStartX = e.touches[0].clientX;
        lpStartY = e.touches[0].clientY;
        clearTimeout(lpTimer);
        lpTimer = setTimeout(() => {
          lpFired = true;
          state.selectMode = true;
          if (state.selectedIds.has(pid)) state.selectedIds.delete(pid);
          else state.selectedIds.add(pid);
          if (typeof window.cvHaptic === 'function') window.cvHaptic('heavy');
          render();
          showToast(state.selectedIds.size + ' preset(s) selected');
        }, 420);
      }, { passive: true });
      document.addEventListener('touchmove', (e) => {
        if (!lpTimer || !e.touches || e.touches.length !== 1) return;
        if (Math.abs(e.touches[0].clientX - lpStartX) > 12 || Math.abs(e.touches[0].clientY - lpStartY) > 12) {
          clearTimeout(lpTimer); lpTimer = null;
        }
      }, { passive: true });
      const cancelLp = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
      document.addEventListener('touchend', cancelLp, { passive: true });
      document.addEventListener('touchcancel', cancelLp, { passive: true });
      document.addEventListener('click', (e) => {
        if (lpFired) { lpFired = false; e.preventDefault(); e.stopImmediatePropagation(); }
      }, true);
    })();
    if (window.VaultPresets) window.VaultPresets.bindAutoSync(syncHubFromVaultPresets);

  <script>

    let renamingPresetTarget = null;
    function openRenamePresetModal(t) {
      if (!t) return;
      renamingPresetTarget = t;
      const inp = document.getElementById('inp-rename-preset');
      if (inp) inp.value = t.name || '';
      const modal = document.getElementById('rename-preset-modal');
      if (modal) modal.classList.remove('hidden');
      setTimeout(() => { if (inp) { inp.focus(); try { inp.select(); } catch (_) {} } }, 60);
    }
    function closeRenamePresetModal() {
      const modal = document.getElementById('rename-preset-modal');
      if (modal) modal.classList.add('hidden');
      renamingPresetTarget = null;
    }
    function saveRenamedPreset() {
      const t = renamingPresetTarget;
      if (!t) return;
      const inp = document.getElementById('inp-rename-preset');
      const newName = (inp && inp.value ? inp.value : '').trim();
      if (!newName) { showToast('Enter a preset name'); return; }
      t.name = newName;
      if (t.cfg) t.cfg.presetName = newName;
      let savedOk = false;
      if (window.VaultPresets && typeof window.VaultPresets.rename === 'function' && t.roomId) {
        const res = window.VaultPresets.rename(t.roomId, newName);
        if (res && res.ok) savedOk = true;
      }
      if (!savedOk && window.VaultPresets && typeof window.VaultPresets.save === 'function') {
        const res = window.VaultPresets.save({
          id: t.roomId ? String(t.roomId) : '',
          name: newName,
          cat: t.cat,
          category: t.cat === 'audio' ? 'Audio' : (t.cat === 'image' ? 'Image' : 'Video'),
          isBuiltIn: t.origin === 'builtin',
          desc: t.desc,
          specs: t.specs,
          bars: { qual: t.qual, comp: t.comp, speed: t.speed, compat: t.compat, edit: t.edit, batt: t.batt },
          cfg: t.cfg || null
        });
        if (res && res.id) t.roomId = res.id;
      }
      closeRenamePresetModal();
      if (typeof syncHubFromVaultPresets === 'function' && window.VaultPresets && window.VaultPresets.hasBridge()) {
        syncHubFromVaultPresets();
      } else {
        render();
      }
      showToast('Renamed preset to "' + newName + '"');
    }
    document.getElementById('btn-rp-cancel').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); closeRenamePresetModal(); });
    document.getElementById('btn-rp-save').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); saveRenamedPreset(); });
    document.getElementById('rename-preset-modal').addEventListener('click', (e) => { if (e.target && e.target.id === 'rename-preset-modal') closeRenamePresetModal(); });
    document.getElementById('inp-rename-preset').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveRenamedPreset(); } });

  </script>
