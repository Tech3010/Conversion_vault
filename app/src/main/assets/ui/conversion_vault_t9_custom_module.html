<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Conversion Vault · Custom Module</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #0f1624;
      --card: #131c2e;
      --card-elev: #172236;
      --input: #0a0f1a;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --subtle: #64748b;
      --crimson: #db0a40;
      --crimson-soft: rgba(219, 10, 64, 0.14);
      --crimson-hover: #be0837;
      --gold: #fcd116;
      --gold-soft: rgba(252, 209, 22, 0.13);
      --gold-text: #fcd116;
      --emerald: #10b981;
      --radius: 12px;
      --radius-sm: 8px;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #f8fafc;
      --card: #f1f5f9;
      --card-elev: #ffffff;
      --input: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --subtle: #64748b;
      --crimson-soft: rgba(219, 10, 64, 0.08);
      --gold-soft: rgba(234, 179, 8, 0.15);
      --gold-text: #a16207;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--sans);
      font-size: 13.5px; line-height: 1.45; min-height: 100vh; display: flex; justify-content: center;
    }
    .app-frame {
      width: 100%; max-width: 540px; min-height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); position: relative; padding-bottom: 86px;
    }
    @media (min-width: 600px) { .app-frame { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }
    .app-bar {
      position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    }
    .back-btn {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .page-title { font-size: 15px; font-weight: 800; line-height: 1.2; }
    .page-sub { font-size: 10.5px; color: var(--crimson); font-family: var(--mono); font-weight: 700; margin-top: 2px; }
    .content { padding: 14px 16px; display: flex; flex-direction: column; gap: 13px; flex: 1; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .card.red-accent { border-top: 2.5px solid var(--crimson); }
    .card-k {
      font-family: var(--mono); font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }
    .mod-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    .pick-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .btn-pick {
      padding: 10px 12px; border-radius: 9px; border: 1px solid rgba(219, 10, 64, 0.5);
      background: var(--crimson-soft); color: var(--crimson); font-family: var(--mono);
      font-size: 11.5px; font-weight: 800; cursor: pointer;
    }
    .file-list { display: flex; flex-direction: column; gap: 6px; }
    .file-pill {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px;
      font-family: var(--mono); font-size: 11px;
    }
    .file-pill-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .btn-rm {
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted);
      border-radius: 5px; width: 24px; height: 24px; font-size: 13px; cursor: pointer; flex-shrink: 0;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; }
    .field input, .field select {
      width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border-strong);
      background: var(--input); color: var(--text); font-size: 12.5px;
    }
    .cmd-box {
      font-family: var(--mono); font-size: 10.5px; color: var(--gold-text); background: var(--input);
      border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; word-break: break-all; line-height: 1.5;
    }
    .bottom-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 540px; background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 40;
    }
    .btn-run {
      flex: 1; padding: 11px 16px; border-radius: 9px; border: 1px solid var(--crimson);
      background: var(--crimson); color: #ffffff; font-size: 13px; font-weight: 800; cursor: pointer;
    }
    .btn-run:disabled { opacity: 0.45; cursor: not-allowed; }
    
    .frame-stage {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #05070d; border: 1px solid var(--border-strong); border-radius: 10px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .frame-stage img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .frame-placeholder {
      font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; padding: 14px;
    }
    .frame-overlay-pill {
      position: absolute; bottom: 8px; right: 8px;
      padding: 3px 8px; border-radius: 6px;
      background: rgba(9, 13, 22, 0.82); border: 1px solid rgba(252, 209, 22, 0.45);
      color: var(--gold-text); font-family: var(--mono); font-size: 10.5px; font-weight: 800;
    }
    .frame-res-pill {
      position: absolute; top: 8px; left: 8px;
      padding: 2px 7px; border-radius: 5px;
      background: rgba(9, 13, 22, 0.8); border: 1px solid var(--border-strong);
      color: var(--muted); font-family: var(--mono); font-size: 10px; font-weight: 700;
    }
    .frame-scrub-row { display: flex; flex-direction: column; gap: 6px; }
    .frame-scrub-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    }
    .frame-scrub-slider { width: 100%; accent-color: var(--crimson); cursor: pointer; }
    .frame-step-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
    .btn-step {
      padding: 6px 4px; border-radius: 6px; border: 1px solid var(--border-strong);
      background: var(--card-elev); color: var(--text); font-family: var(--mono);
      font-size: 10px; font-weight: 800; cursor: pointer;
    }
    .btn-step:hover { border-color: var(--crimson); color: var(--crimson); }

    .hidden { display: none !important; }
    .toast {
      position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px;
      font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 120;
    }
    .toast.show { opacity: 1; }
  </style>
  <script>
    (function(){
      try {
        var t = (window.AndroidBridge && window.AndroidBridge.getAppState && window.AndroidBridge.getAppState('cv_theme')) || localStorage.getItem('cv_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
  <script src="vault-custom-modules.js"></script>
  <script src="vault-json-guard.js"></script>
</head>
<body>
  <div class="app-frame">
    <header class="app-bar">
      <button type="button" id="btn-back" class="back-btn" aria-label="Back to Home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <div style="min-width:0; flex:1;">
        <div class="page-title" id="cm-title">Custom Module</div>
        <div class="page-sub" id="cm-sub">CUSTOM MODULE · FFMPEG ENGINE</div>
      </div>
    </header>

    <main class="content">
      <section class="card red-accent">
        <div class="card-k">Module Details</div>
        <div class="mod-desc" id="cm-desc">Loading custom module...</div>
      </section>

      <section class="card">
        <div class="card-k">1. Select Input File(s)</div>
        <div class="pick-row">
          <button type="button" id="btn-cm-pick-one" class="btn-pick">+ Pick File</button>
          <button type="button" id="btn-cm-pick-multi" class="btn-pick">+ Pick Multiple</button>
        </div>
        <div class="file-list" id="cm-files-list"></div>
      </section>


      <section class="card red-accent hidden" id="cm-frame-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="card-k">Live Frame Preview</div>
          <span style="font-family:var(--mono); font-size:10px; color:var(--gold-text);" id="cm-frame-status">Pick a video to preview frames</span>
        </div>
        <div class="frame-stage">
          <img id="cm-frame-img" class="hidden" alt="Selected video frame">
          <div id="cm-frame-empty" class="frame-placeholder">Select a video above to scrub and preview the exact frame</div>
          <span class="frame-res-pill hidden" id="cm-frame-res">—</span>
          <span class="frame-overlay-pill" id="cm-frame-ts">00:00:01.000</span>
        </div>
        <div class="frame-scrub-row">
          <div class="frame-scrub-meta">
            <span id="cm-scrub-cur">00:00:01.000</span>
            <span id="cm-scrub-dur">00:00:00.000</span>
          </div>
          <input type="range" id="cm-frame-slider" class="frame-scrub-slider" min="0" max="10000" step="50" value="1000">
        </div>
        <div class="frame-step-row">
          <button type="button" class="btn-step" data-step-ms="-5000">-5s</button>
          <button type="button" class="btn-step" data-step-ms="-1000">-1s</button>
          <button type="button" class="btn-step" data-step-ms="-100">-0.1s</button>
          <button type="button" class="btn-step" data-step-ms="100">+0.1s</button>
          <button type="button" class="btn-step" data-step-ms="1000">+1s</button>
          <button type="button" class="btn-step" data-step-ms="5000">+5s</button>
        </div>
      </section>

      <section class="card hidden" id="cm-inputs-card">
        <div class="card-k">2. Module Options</div>
        <div id="cm-inputs-wrap" style="display:flex; flex-direction:column; gap:10px;"></div>
      </section>

      <section class="card">
        <div class="card-k">FFmpeg Command Preview</div>
        <div class="cmd-box" id="cm-cmd-preview">—</div>
      </section>
    </main>

    <footer class="bottom-bar">
      <button type="button" id="btn-cm-run" class="btn-run" disabled>Run Custom Module ▶</button>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search || '');
      const modId = params.get('id') || '';
      const mod = (window.VaultCustomModules && window.VaultCustomModules.getById(modId)) || null;
      let pickedFiles = [];
      const inputValues = {};

      function toast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(window.__cmToastT);
        window.__cmToastT = setTimeout(() => t.classList.remove('show'), 2200);
      }

      function escHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function updatePreview() {
        const el = document.getElementById('cm-cmd-preview');
        if (!el || !mod) return;
        el.textContent = window.VaultCustomModules.buildCommand(mod, inputValues);
      }

      function renderFiles() {
        const list = document.getElementById('cm-files-list');
        const btnRun = document.getElementById('btn-cm-run');
        if (btnRun) btnRun.disabled = !mod || pickedFiles.length === 0;
        if (!list) return;
        if (!pickedFiles.length) {
          list.innerHTML = '<div style="font-size:12px; color:var(--muted);">No files selected yet.</div>';
          return;
        }
        list.innerHTML = pickedFiles.map((f, i) =>
          '<div class="file-pill"><span class="file-pill-name">' + escHtml(f.name || f.path) + '</span>' +
          '<button type="button" class="btn-rm" data-rm="' + i + '">×</button></div>'
        ).join('');
      }

      if (!mod) {
        document.getElementById('cm-desc').textContent = 'Custom module not found. Go back to Home and re-import its JSON file.';
      } else {
        document.getElementById('cm-title').textContent = mod.name;
        document.getElementById('cm-sub').textContent = 'CUSTOM MODULE · OUTPUT .' + mod.outputExt.toUpperCase();
        document.getElementById('cm-desc').textContent = mod.description;

        if (mod.inputs && mod.inputs.length > 0) {
          const card = document.getElementById('cm-inputs-card');
          const wrap = document.getElementById('cm-inputs-wrap');
          card.classList.remove('hidden');
          wrap.innerHTML = mod.inputs.map(inp => {
            inputValues[inp.key] = inp.default || '';
            if (inp.type === 'select') {
              const opts = (inp.options || []).map(o => '<option value="' + escHtml(o.value) + '"' + (o.value === inp.default ? ' selected' : '') + '>' + escHtml(o.label) + '</option>').join('');
              return '<div class="field"><label>' + escHtml(inp.label) + '</label><select data-inp-key="' + escHtml(inp.key) + '">' + opts + '</select></div>';
            }
            if (inp.type === 'range') {
              return '<div class="field"><label><span>' + escHtml(inp.label) + '</span><span id="val-' + escHtml(inp.key) + '" style="color:var(--gold-text);">' + escHtml(inp.default) + '</span></label>' +
                '<input type="range" data-inp-key="' + escHtml(inp.key) + '" min="' + (inp.min ?? 0) + '" max="' + (inp.max ?? 100) + '" step="' + (inp.step ?? 1) + '" value="' + escHtml(inp.default) + '"></div>';
            }
            return '<div class="field"><label>' + escHtml(inp.label) + '</label><input type="' + (inp.type === 'number' ? 'number' : 'text') + '" data-inp-key="' + escHtml(inp.key) + '" value="' + escHtml(inp.default) + '"></div>';
          }).join('');

          wrap.addEventListener('input', (e) => {
            const k = e.target && e.target.getAttribute('data-inp-key');
            if (!k) return;
            inputValues[k] = e.target.value;
            const vEl = document.getElementById('val-' + k);
            if (vEl) vEl.textContent = e.target.value;
            updatePreview();
          });
          wrap.addEventListener('change', (e) => {
            const k = e.target && e.target.getAttribute('data-inp-key');
            if (!k) return;
            inputValues[k] = e.target.value;
            updatePreview();
          });
        }
        updatePreview();
      }


      let frameDurMs = 0;
      let frameCurMs = 1000;
      let frameDebounce = null;

      function fmtTimestampMs(ms) {
        const safe = Math.max(0, Math.round(ms || 0));
        const h = Math.floor(safe / 3600000);
        const m = Math.floor((safe % 3600000) / 60000);
        const s = Math.floor((safe % 60000) / 1000);
        const rem = safe % 1000;
        return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(rem).padStart(3, '0');
      }

      function syncFrameTsToInput(ms) {
        frameCurMs = Math.max(0, frameDurMs > 0 ? Math.min(frameDurMs, ms) : ms);
        const tsStr = fmtTimestampMs(frameCurMs);
        const tsEl = document.getElementById('cm-frame-ts');
        const curEl = document.getElementById('cm-scrub-cur');
        const sl = document.getElementById('cm-frame-slider');
        if (tsEl) tsEl.textContent = tsStr;
        if (curEl) curEl.textContent = tsStr;
        if (sl) sl.value = String(Math.round(frameCurMs));
        if (mod && (mod.inputs || []).some(i => i.key === 'TIMESTAMP')) {
          inputValues.TIMESTAMP = tsStr;
          const inpEl = document.querySelector('[data-inp-key="TIMESTAMP"]');
          if (inpEl) inpEl.value = tsStr;
          updatePreview();
        }
      }

      function requestNativeFrame(ms) {
        if (!mod || !mod.framePreview || !pickedFiles.length) return;
        const firstPath = pickedFiles[0].path || '';
        if (!firstPath) return;
        const stEl = document.getElementById('cm-frame-status');
        if (stEl) stEl.textContent = 'Decoding frame...';
        if (window.AndroidBridge && typeof window.AndroidBridge.extractVideoFrameBase64 === 'function') {
          try {
            const res = JSON.parse(window.AndroidBridge.extractVideoFrameBase64(firstPath, Math.round(ms)) || '{}');
            if (res && res.ok && res.dataUrl) {
              if (res.durationMs && res.durationMs > 0) {
                frameDurMs = res.durationMs;
                const sl = document.getElementById('cm-frame-slider');
                const durEl = document.getElementById('cm-scrub-dur');
                if (sl) sl.max = String(frameDurMs);
                if (durEl) durEl.textContent = fmtTimestampMs(frameDurMs);
              }
              const img = document.getElementById('cm-frame-img');
              const emp = document.getElementById('cm-frame-empty');
              const resPill = document.getElementById('cm-frame-res');
              if (img) { img.src = res.dataUrl; img.classList.remove('hidden'); }
              if (emp) emp.classList.add('hidden');
              if (resPill && res.width && res.height) {
                resPill.textContent = res.width + ' × ' + res.height;
                resPill.classList.remove('hidden');
              }
              if (stEl) stEl.textContent = 'Live Frame Ready';
              return;
            }
            if (stEl) stEl.textContent = (res && res.error) || 'Frame preview unavailable';
          } catch (_) {
            if (stEl) stEl.textContent = 'Frame decode error';
          }
        } else {
          if (stEl) stEl.textContent = 'Live frame preview runs inside Android APK';
        }
      }

      if (mod && mod.framePreview) {
        const fc = document.getElementById('cm-frame-card');
        if (fc) fc.classList.remove('hidden');
        const sl = document.getElementById('cm-frame-slider');
        if (sl) {
          sl.addEventListener('input', () => {
            syncFrameTsToInput(Number(sl.value || 0));
            clearTimeout(frameDebounce);
            frameDebounce = setTimeout(() => requestNativeFrame(frameCurMs), 120);
          });
          sl.addEventListener('change', () => {
            clearTimeout(frameDebounce);
            requestNativeFrame(frameCurMs);
          });
        }
        document.querySelectorAll('[data-step-ms]').forEach(btn => {
          btn.addEventListener('click', () => {
            const delta = parseInt(btn.getAttribute('data-step-ms'), 10) || 0;
            syncFrameTsToInput(frameCurMs + delta);
            requestNativeFrame(frameCurMs);
          });
        });
      }

      window.onVaultCustomModuleFilesPicked = function (files) {
        if (!Array.isArray(files) || !files.length) return;
        const seen = new Set(pickedFiles.map(x => x.path || x.name));
        let added = 0;
        files.forEach(f => {
          const key = f.path || f.name;
          if (!seen.has(key)) { seen.add(key); pickedFiles.push(f); added++; }
        });
        renderFiles();
        if (mod && mod.framePreview && pickedFiles.length > 0) { syncFrameTsToInput(frameCurMs); setTimeout(() => requestNativeFrame(frameCurMs), 40); }
        toast('Added ' + added + ' file' + (added === 1 ? '' : 's'));
      };

      document.getElementById('cm-files-list').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-rm]');
        if (!btn) return;
        const idx = parseInt(btn.getAttribute('data-rm'), 10);
        if (!isNaN(idx)) { pickedFiles.splice(idx, 1); renderFiles(); }
      });

      document.getElementById('btn-cm-pick-one').addEventListener('click', () => {
        if (window.AndroidBridge && typeof window.AndroidBridge.pickFile === 'function') {
          window.AndroidBridge.pickFile();
        } else { toast('File picker runs inside Android APK'); }
      });
      document.getElementById('btn-cm-pick-multi').addEventListener('click', () => {
        if (window.AndroidBridge && typeof window.AndroidBridge.pickMultipleFiles === 'function') {
          window.AndroidBridge.pickMultipleFiles();
        } else { toast('File picker runs inside Android APK'); }
      });

      document.getElementById('btn-back').addEventListener('click', () => {
        if (window.AndroidBridge && typeof window.AndroidBridge.navigate === 'function') {
          window.AndroidBridge.navigate('conversion_vault_p1_home.html');
        } else { window.location.href = 'conversion_vault_p1_home.html'; }
      });

      document.getElementById('btn-cm-run').addEventListener('click', () => {
        if (!mod || !pickedFiles.length) return;
        if (!window.AndroidBridge) { toast('Native engine runs inside Android APK'); return; }
        const cmdArgs = window.VaultCustomModules.buildCommand(mod, inputValues);
        const mType = mod.mediaType === 'audio' ? 'Audio' : (mod.mediaType === 'image' ? 'Image' : 'Video');
        const jobSpecs = pickedFiles.map(f => ({
          module: 'Custom_Modules',
          outputDir: '',
          subBucket: mod.outputSubfolder || mod.name.replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 32),
          mediaType: mType,
          inputPath: f.path,
          outputBaseName: '',
          outputExt: (mod.outputExtInputKey && inputValues[mod.outputExtInputKey]) ? String(inputValues[mod.outputExtInputKey]).replace(/^\./, '').toLowerCase() : (mod.outputExt || 'mp4'),
          durationMs: 0,
          commandArgs: cmdArgs
        }));

        let queuedCount = 0;
        let lastErr = '';
        if (typeof window.AndroidBridge.enqueueBatchJobs === 'function') {
          const res = JSON.parse(window.AndroidBridge.enqueueBatchJobs(JSON.stringify(jobSpecs)) || '{}');
          if (res && res.ok) {
            queuedCount = res.count || jobSpecs.length;
            if (res.firstJobId) {
              try { window.AndroidBridge.setAppState('cv_active_job_id', res.firstJobId); } catch (_) {}
              try { localStorage.setItem('cv_active_job_id', res.firstJobId); } catch (_) {}
            }
            const jIds = res.jobIds || [];
            try { window.AndroidBridge.setAppState('cv_batch_job_ids', JSON.stringify(jIds)); } catch (_) {}
            try { localStorage.setItem('cv_batch_job_ids', JSON.stringify(jIds)); } catch (_) {}
          } else { lastErr = (res && res.error) || 'Queue failed'; }
        }
        if (queuedCount === 0) { toast('Failed: ' + (lastErr || 'No valid files')); return; }
        const target = queuedCount === 1 ? 'conversion_vault_p4a_convert_single.html' : 'conversion_vault_p4_convert_batch.html';
        if (typeof window.AndroidBridge.navigate === 'function') window.AndroidBridge.navigate(target);
        else window.location.href = target;
      });

      renderFiles();
    })();
  </script>
  <script src="vault-bridge.js"></script>
</body>
